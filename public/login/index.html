<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>登录 · 校序</title>
<style>
:root{font-family:Inter,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a3150;background:#f4f8ff}
*{box-sizing:border-box}
body{min-height:100dvh;margin:0;padding:clamp(40px,10vh,96px) 18px 30px;display:flex;justify-content:center;align-items:flex-start;background:radial-gradient(ellipse at 50% 0%,#e8f1ff 0%,#f4f8ff 58%,#f9fbff 100%)}
main{width:min(100%,380px);padding:28px;background:#fff;border:1px solid #e5ecf6;border-radius:20px;box-shadow:0 15px 46px rgba(36,80,143,.07)}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:750;letter-spacing:-.02em}
.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:#fff;background:#2c71e9;font-size:19px;font-weight:750}
h1{font-size:25px;line-height:1.25;margin:24px 0 22px;letter-spacing:-.035em}
label{display:block;margin:0 0 9px;font-size:13px;font-weight:660;color:#48617e}
.password-field{position:relative}
input{width:100%;height:48px;border:1px solid #ccd9ec;border-radius:12px;background:#fff;padding:0 62px 0 14px;font:inherit;font-size:15px;color:#1a3150;transition:border-color .16s,box-shadow .16s}
input::placeholder{color:#9aaabd}
input:focus{outline:none;border-color:#3474e9;box-shadow:0 0 0 3px rgba(52,116,233,.12)}
.toggle{position:absolute;right:5px;top:4px;min-width:50px;height:40px;padding:0 7px;border:0;background:transparent;color:#526d93;font-size:13px;font-weight:600;cursor:pointer;border-radius:9px}
.toggle:focus-visible,.back:focus-visible{outline:2px solid #3474e9;outline-offset:3px}
.primary{display:block;width:100%;height:48px;margin-top:17px;border:0;border-radius:12px;background:#2869e4;color:white;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:background .16s,transform .16s}
.primary:hover{background:#195bd5}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.65;cursor:wait}
#logout{background:#edf3fe;color:#205ec4}
#result{margin-top:15px;font-size:13px;line-height:1.55;color:#526782;overflow-wrap:anywhere}
#result:empty{display:none}
.back{display:block;width:max-content;margin:23px auto 0;color:#6b819f;text-decoration:none;font-size:13px}
.back:hover{text-decoration:underline;color:#2664d1}
[hidden]{display:none!important}
@media(max-width:420px){main{padding:25px 22px;border-radius:18px}body{padding-top:clamp(28px,8vh,72px)}h1{margin-top:23px;margin-bottom:20px}}
@media(prefers-reduced-motion:reduce){input,.primary{transition:none}}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="logo" aria-hidden="true">序</span><span>校序</span></div>
  <h1 id="title">登录</h1>
  <form id="form">
    <label for="passphrase">个人密码</label>
    <div class="password-field">
      <input id="passphrase" type="password" name="passphrase" required minlength="8" maxlength="256" autocomplete="current-password" placeholder="输入密码">
      <button id="toggle" class="toggle" type="button" aria-label="显示密码">显示</button>
    </div>
    <button id="submit" class="primary" type="submit">安全登录</button>
  </form>
  <button id="logout" class="primary" type="button" hidden>退出当前设备</button>
  <div id="result" role="status" aria-live="polite"></div>
  <a href="/" class="back">返回首页</a>
</main>
<script>
const form=document.getElementById('form');
const button=document.getElementById('submit');
const result=document.getElementById('result');
const input=document.getElementById('passphrase');
const logout=document.getElementById('logout');
const title=document.getElementById('title');
const toggle=document.getElementById('toggle');
const report=text=>{result.textContent=text};
const signedIn=()=>{
 form.hidden=true;logout.hidden=false;title.textContent='已登录';
 report('当前设备已登录，可直接返回首页。');
};
const signedOut=()=>{form.hidden=false;logout.hidden=true;title.textContent='登录';};
toggle.addEventListener('click',()=>{
 const show=input.type==='password';
 input.type=show?'text':'password';
 toggle.textContent=show?'隐藏':'显示';
 toggle.setAttribute('aria-label',show?'隐藏密码':'显示密码');
 input.focus({preventScroll:true});
});
async function check(){
 try{
  const r=await fetch('/api/v1/auth/me',{credentials:'same-origin',cache:'no-store'});
  if(r.ok){
   const status=await r.json();
   if(status.authenticated===true){
    try{localStorage.setItem('xiaoxu_owner_login_seen','1')}catch{}
    signedIn();
   }
  }
 }catch{report('暂时无法检查登录状态。')}
}
logout.addEventListener('click',async()=>{
 logout.disabled=true;report('正在退出…');
 try{
  const r=await fetch('/api/v1/auth/logout',{method:'POST',credentials:'same-origin',cache:'no-store'});
  if(!r.ok)throw Error('logout_failed');
  try{localStorage.removeItem('xiaoxu_owner_login_seen')}catch{}
  signedOut();input.value='';input.type='password';toggle.textContent='显示';toggle.setAttribute('aria-label','显示密码');
  report('已退出当前设备。');
 }catch{report('退出失败，请检查网络后重试。')}
 finally{logout.disabled=false}
});
form.addEventListener('submit',async e=>{
 e.preventDefault();button.disabled=true;report('正在验证…');
 try{
  const r=await fetch('/api/v1/auth/login',{
   method:'POST',credentials:'same-origin',
   headers:{'content-type':'application/json'},
   body:JSON.stringify({passphrase:input.value})
  });
  input.value='';
  if(r.ok){
   try{localStorage.setItem('xiaoxu_owner_login_seen','1')}catch{}
   report('登录成功，正在进入校序…');location.assign('/');return;
  }
  const data=await r.json().catch(()=>({}));
  report(r.status===429?'尝试次数过多，请 15 分钟后重试。':
   r.status===503?'登录服务尚未配置或数据库未就绪。':
   r.status===401?'密码错误，请重试。':'登录失败：'+(data.error||r.status));
 }catch{report('网络异常，请重试。')}
 finally{button.disabled=false}
});
check();
</script>
</body>
</html>
