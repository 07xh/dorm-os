<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>本人登录 · 校序</title>
<style>
:root{font-family:Inter,system-ui,"PingFang SC",sans-serif;color:#18304b;background:#eef5ff}*{box-sizing:border-box}
body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:20px;background:radial-gradient(circle at 70% 10%,#cce3ff,#eef5ff 55%)}
main{width:min(430px,100%);background:white;border:1px solid #dce6f5;box-shadow:0 25px 80px #3769b522;border-radius:24px;padding:32px}
.brand{display:flex;gap:12px;align-items:center;font-size:21px;font-weight:800}.logo{display:grid;place-items:center;width:44px;height:44px;background:#306feb;border-radius:14px;color:white}
small,p{color:#637994;line-height:1.65}h1{font-size:24px;margin:30px 0 8px}label{display:block;font-weight:650;margin:24px 0 9px}
input{width:100%;font:inherit;border:1px solid #bdcfe6;border-radius:12px;padding:14px;color:#193653;background:#fff}input:focus{outline:3px solid #c4d9ff;border-color:#386cdb}
button{width:100%;font:inherit;background:#2263de;border:0;color:white;font-weight:730;border-radius:12px;padding:14px;margin-top:17px;cursor:pointer}button:disabled{opacity:.65}[hidden]{display:none!important}
#result{min-height:2em;font-size:13px;margin-top:15px}a{color:#2765d3}.back{display:block;margin-top:25px;font-size:13px;text-align:center}
</style></head><body><main><div class="brand"><span class="logo" aria-hidden="true">序</span><span>校序 <small>ACADEMIC OS</small></span></div>
<h1>登录个人云端</h1><p>仅供本人使用。使用 Cloudflare Pages Secrets 中配置的个人登录口令。不会上传至第三方学校平台。</p>
<form id="form"><label for="passphrase">个人登录口令</label><input id="passphrase" type="password" name="passphrase" required minlength="8" maxlength="256" autocomplete="current-password" placeholder="输入本人设置的口令">
<button id="submit" type="submit">安全登录</button></form>
<button id="logout" type="button" hidden>退出当前设备</button>
<div id="result" role="status" aria-live="polite"></div><a href="/" class="back">返回校序首页</a></main>
<script>
const form=document.getElementById('form'),button=document.getElementById('submit'),result=document.getElementById('result'),input=document.getElementById('passphrase'),logout=document.getElementById('logout');
const report=text=>{result.textContent=text};
async function check(){try{
 const r=await fetch('/api/v1/auth/me',{credentials:'same-origin',cache:'no-store'});
 if(r.ok){
  const status=await r.json();
  if(status.authenticated===true){try{localStorage.setItem('xiaoxu_owner_login_seen','1')}catch{} form.hidden=true;logout.hidden=false;report('当前设备已登录，无需再次输入口令。可直接返回首页。');}
 }
}catch{report('暂时无法验证登录状态。可尝试登录，或稍后重试。')}}
logout.addEventListener('click',async()=>{
 logout.disabled=true;report('正在退出当前设备…');
 try{
  const r=await fetch('/api/v1/auth/logout',{method:'POST',credentials:'same-origin',cache:'no-store'});
  if(!r.ok)throw Error('logout_failed');
  try{localStorage.removeItem('xiaoxu_owner_login_seen')}catch{} form.hidden=false;logout.hidden=true;input.value='';report('已退出此设备的云端会话。');
 }catch{report('退出失败，请检查网络后重试。')}finally{logout.disabled=false}
});
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;report('正在验证登录…');try{
 const r=await fetch('/api/v1/auth/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({passphrase:input.value})});
 input.value='';
 if(r.ok){try{localStorage.setItem('xiaoxu_owner_login_seen','1')}catch{} report('登录成功，正在打开校序…');location.assign('/');return;}
 const data=await r.json().catch(()=>({}));
 report(r.status===429?'尝试次数过多，请过 15 分钟再试。':r.status===503?'服务端登录还未配置或数据库迁移未就绪。':r.status===401?'口令错误，请重试。':'请求失败：'+(data.error||r.status));
}catch{report('网络异常，无法连接登录服务。')}finally{button.disabled=false}});
check();
</script></body></html>
