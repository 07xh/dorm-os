// This is an opt-in preference, NEVER a session, credential or authorization.
const CLOUD_RESUME_PREF='xiaoxu-cloud-opted-in-v1';
let cloudResumeGeneration=0,cloudResumeInFlight=false;
function cloudWasOptedIn(){
 try{return localStorage.getItem(CLOUD_RESUME_PREF)==='1';}catch{return false;}
}
function rememberCloudOptIn(enabled){
 try{
  if(enabled)localStorage.setItem(CLOUD_RESUME_PREF,'1');
  else localStorage.removeItem(CLOUD_RESUME_PREF);
 }catch{}
}
function clearPrivateCloudWorkspace(){
 cloudResumeGeneration++;rememberCloudOptIn(false);
 XiaoxuAcademic.disconnect();XiaoxuCloudTasks.disconnect();XiaoxuChaoxingInbox.disconnect();XiaoxuReminders.disconnect();XiaoxuWechat.disconnect();
}
// Only a previously opted-in device with a VERIFIED existing owner session
// resumes the same cloud workspace. No new school login or credential storage.
async function resumeOptedCloudWorkspace(){
 if(!cloudWasOptedIn()||cloudResumeInFlight||XiaoxuCloudTasks.isReady())return false;
 const generation=cloudResumeGeneration;
 cloudResumeInFlight=true;
 try{
  await XiaoxuAcademic.connect();
  if(generation!==cloudResumeGeneration)return false;
  await Promise.allSettled([XiaoxuCloudTasks.connect(),XiaoxuReminders.connect(),XiaoxuChaoxingInbox.refresh()]);
  if(generation!==cloudResumeGeneration)return false;
  if(['settings','tasks','academic','dashboard','profile'].includes(page))render();
  return true;
 }catch{
  // Keep the opt-in preference on transient network failures; server auth
  // failures are handled by the verified owner-session controller.
  if(generation===cloudResumeGeneration&&page==='settings')render();
  return false;
 }finally{cloudResumeInFlight=false;}
}
const TZ = 'Asia/Shanghai';
const CAMPUSES = Object.freeze({
  jianghuai: { name: '江淮校区', city: '罗山', lat: 32.20, lon: 114.53 },
  huayuan: { name: '花园校区', city: '郑州', lat: 34.78, lon: 113.65 }
});
const HOME_WIDGETS=Object.freeze([{"id":"timetable","label":"今日课表","description":"今天的课程、教室和下一节安排"},{"id":"tasks","label":"我的待办","description":"待完成任务、截止日期和逾期数量"},{"id":"focus","label":"专注计时","description":"15、25、45 分钟专注计时"},{"id":"life","label":"个人生活","description":"生活提醒、个人物品和 NFC 标签数量"},{"id":"weather","label":"天气","description":"校区实时天气与出门提示"}]);
function defaultHomeLayout(){return {order:HOME_WIDGETS.map(x=>x.id),hidden:[]};}
function normalizeHomeLayout(value){const ids=HOME_WIDGETS.map(x=>x.id);const order=[...new Set((Array.isArray(value?.order)?value.order:[]).filter(x=>ids.includes(x)))];for(const id of ids)if(!order.includes(id))order.push(id);let hidden=[...new Set((Array.isArray(value?.hidden)?value.hidden:[]).filter(x=>ids.includes(x)))];if(hidden.length>=ids.length)hidden=[];return {order,hidden};}
const DEFAULT_STATE = Object.freeze({
  version: 1,
  settings: { campus: 'jianghuai', theme: 'light', homeLayout: defaultHomeLayout() },
  tasks: [], classes: [], calendarEvents: [], campusLinks: [], events: [], nfcTags: [], reminders: [], items: [], sceneLinks: [],
  scene: 'none',
  focusTimer: {duration:25,remaining:1500,running:false,deadline:0},
  awayChecklist: {date:'',checked:[]},
  electricity: { balance: null, updatedAt: null }
});
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const CATEGORIES = ['课程','高数','工程制图','Python','英语','生活','其他'];
function chinaParts(date = new Date()) {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'}).formatToParts(date).map(p=>[p.type,p.value]));
  const map = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {date:`${parts.year}-${parts.month}-${parts.day}`,time:`${parts.hour}:${parts.minute}`,hour:Number(parts.hour),minute:Number(parts.minute),day:map[parts.weekday],year:Number(parts.year),month:Number(parts.month),dateNumber:Number(parts.day)};
}
function validSceneLinkUrl(raw) {
  try {
    const u=new URL(String(raw??'').trim());
    if(u.protocol!=='https:'||u.username||u.password||!u.hostname.includes('.')||u.href.length>400)return '';
    const blocked=['token','access_token','api_key','password','passwd','secret','session','auth'];
    if([...u.searchParams.keys()].some(x=>blocked.includes(x.toLowerCase())))return '';
    return u.href;
  }catch{return '';}
}
function normalizeFocusTimer(source,time=Date.now()){
 const duration=[15,25,45].includes(source?.duration)?source.duration:25;
 const max=duration*60;
 const remaining=Number.isInteger(source?.remaining)&&source.remaining>=0&&source.remaining<=max?source.remaining:max;
 const deadline=source?.deadline;
 if(source?.running===true&&Number.isFinite(deadline)&&deadline>0&&deadline<=time)return {duration,remaining:0,running:false,deadline:0};
 if(source?.running===true&&Number.isFinite(deadline)&&deadline>time&&deadline<=time+max*1000+2000){
   return {duration,remaining:Math.max(0,Math.min(max,Math.ceil((deadline-time)/1000))),running:true,deadline};
 }
 return {duration,remaining,running:false,deadline:0};
}
function safeState(value){
  if (!value || typeof value !== 'object' || Array.isArray(value) || value.version !== 1) throw new Error('不是受支持的 DORM OS V1 备份');
  const campus = CAMPUSES[value.settings?.campus] ? value.settings.campus : 'jianghuai';
  const homeLayout = normalizeHomeLayout(value.settings?.homeLayout);
  const cleanText = (x,max=100) => String(x??'').trim().slice(0,max);
  const dateRE = /^\d{4}-\d{2}-\d{2}$/;
  const timeRE = /^([01]\d|2[0-3]):[0-5]\d$/;
  const tasks = (Array.isArray(value.tasks)?value.tasks:[]).slice(0,300).filter(x=>x && typeof x==='object').map((x,i)=>({
    id:cleanText(x.id,60)||`task-${i}`,title:cleanText(x.title,100),category:CATEGORIES.includes(x.category)?x.category:'其他',due:dateRE.test(x.due)?x.due:'',dueAt:typeof x.dueAt==='string'&&/^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:00\+08:00$/.test(x.dueAt)&&x.dueAt.slice(0,10)===x.due?x.dueAt:'',done:x.done===true,createdAt:cleanText(x.createdAt,40),source:['chaoxing','ncwu','second_class'].includes(x.source)&&cleanText(x.sourceId,80)?x.source:'manual',sourceId:cleanText(x.sourceId,80),sourceStatus:['todo','submitted','graded','returned','unknown'].includes(x.sourceStatus)?x.sourceStatus:'unknown',course:cleanText(x.course,80),importedAt:cleanText(x.importedAt,40)
  })).filter(x=>x.title).map(x=>({...x,prerequisiteIds:Array.isArray(value.tasks?.find(t=>t?.id===x.id)?.prerequisiteIds)?value.tasks.find(t=>t?.id===x.id).prerequisiteIds:[]}));
  const classes = (Array.isArray(value.classes)?value.classes:[]).slice(0,150).filter(x=>x && typeof x==='object' && Number.isInteger(x.day) && x.day>=0 && x.day<=6 && timeRE.test(x.start) && timeRE.test(x.end) && x.start<x.end).map((x,i)=>({
    id:cleanText(x.id,60)||`class-${i}`,day:x.day,start:x.start,end:x.end,subject:cleanText(x.subject,80),location:cleanText(x.location,60)
  })).filter(x=>x.subject);
  const calendarEvents = (Array.isArray(value.calendarEvents)?value.calendarEvents:[]).slice(0,1200).filter(x=>x&&typeof x==='object'&&dateRE.test(x.date)&&timeRE.test(x.start)&&timeRE.test(x.end)&&x.start<x.end).map((x,i)=>({id:cleanText(x.id,180)||`event-${i}`,uid:cleanText(x.uid,120),date:x.date,start:x.start,end:x.end,subject:cleanText(x.subject,80),location:cleanText(x.location,60),source:'iCalendar'})).filter(x=>x.subject);
  const campusLinks=(Array.isArray(value.campusLinks)?value.campusLinks:[]).slice(0,30).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,60)||`link-${i}`,name:cleanText(x.name,40),url:cleanText(x.url,300)})).filter(x=>x.name&&/^https:\/\/[^\s/]+(?:\/[^\s]*)?$/.test(x.url));
  const nfcTags = (Array.isArray(value.nfcTags)?value.nfcTags:[]).slice(0,60).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,80)||`tag-${i}`,name:cleanText(x.name,40),scene:['study','rest','dev','away'].includes(x.scene)?x.scene:'study',createdAt:cleanText(x.createdAt,40),writtenScene:['study','rest','dev','away'].includes(x.writtenScene)?x.writtenScene:'',writtenAt:cleanText(x.writtenAt,40),readAt:cleanText(x.readAt,40),readScene:['study','rest','dev','away'].includes(x.readScene)?x.readScene:''})).filter(x=>x.name);
  const sceneLinks=(Array.isArray(value.sceneLinks)?value.sceneLinks:[]).slice(0,40).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,60)||`scene-link-${i}`,scene:['study','rest','dev','away'].includes(x.scene)?x.scene:'study',name:cleanText(x.name,50),url:validSceneLinkUrl(x.url)})).filter(x=>x.name&&x.url);
  const reminders = (Array.isArray(value.reminders)?value.reminders:[]).slice(0,120).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,60)||`reminder-${i}`,text:cleanText(x.text,100),due:dateRE.test(x.due)?x.due:'',done:x.done===true})).filter(x=>x.text);
  const items = (Array.isArray(value.items)?value.items:[]).slice(0,120).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,60)||`item-${i}`,name:cleanText(x.name,80),place:cleanText(x.place,80)})).filter(x=>x.name);
  const awayChecklist={date:dateRE.test(value.awayChecklist?.date)?value.awayChecklist.date:'',checked:Array.isArray(value.awayChecklist?.checked)?[...new Set(value.awayChecklist.checked.filter(x=>['keys','campusCard','phone','water','studyMaterials','earphones'].includes(x)))]:[]};
  const events = (Array.isArray(value.events)?value.events:[]).slice(-80).filter(x=>x&&typeof x==='object').map(x=>({at:cleanText(x.at,40),text:cleanText(x.text,120)}));
  const amount = value.electricity?.balance;
  return {version:1,settings:{campus,theme:value.settings?.theme==='dark'?'dark':'light',homeLayout},tasks:(globalThis.XiaoxuWorkspace?.sanitizePrerequisites?.(tasks)||tasks),classes,calendarEvents,campusLinks,events,nfcTags,reminders,items,sceneLinks,scene:['none','study','rest','dev','away'].includes(value.scene)?value.scene:'none',awayChecklist,focusTimer:normalizeFocusTimer(value.focusTimer),electricity:{balance:typeof amount==='number' && Number.isFinite(amount) && amount>=0 && amount<100000?amount:null,updatedAt:cleanText(value.electricity?.updatedAt,40)||null}};
}
function classForDay(classes, day) {return classes.filter(x=>x.day===day).sort((a,b)=>a.start.localeCompare(b.start));}
function upcomingClass(classes, day, time) {
  for(let offset=0;offset<=7;offset++) {
    const target=(day+offset)%7;
    const eligible=classForDay(classes,target).filter(c=>offset>0||c.end>time);
    if(eligible.length) return {...eligible[0],daysAway:offset};
  }
  return null;
}
function weatherInfo(code) {
  if(code===0) return {name:'晴',icon:'☀️'};
  if([1,2,3].includes(code)) return {name:'多云',icon:'⛅'};
  if([45,48].includes(code)) return {name:'有雾',icon:'🌫️'};
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return {name:'有雨',icon:'🌧️'};
  if([71,73,75,77,85,86].includes(code)) return {name:'有雪',icon:'🌨️'};
  if([95,96,99].includes(code)) return {name:'雷雨',icon:'⛈️'};
  return {name:'天气未知',icon:'🌤️'};
}
function weatherAdvice(weather) {
  if(!weather) return '联网后显示出门建议';
  if(weather.rainChance>=55 || weather.rain>0) return '有降水可能，出门带伞';
  if(weather.feels<10) return '体感较冷，注意保暖';
  if(weather.feels>=30) return '体感炎热，注意补水';
  return '出门前查看课程与随身物品';
}
function eInkPayload(state,weather, now=new Date()) {
  const p=chinaParts(now), cls=upcomingClass(state.classes,p.day,p.time);
  return {schema:'dorm-os/eink-v1',generated_at:now.toISOString(),timezone:TZ,campus:state.settings.campus,location:CAMPUSES[state.settings.campus].city,clock:p.time,date:p.date,weather:weather?{temp:weather.temp,feels:weather.feels,description:weatherInfo(weather.code).name,last_updated:weather.fetchedAt}:null,next_class:cls?{subject:cls.subject,location:cls.location,start:cls.start,day:cls.day}:null,tasks:state.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,3).map(t=>({title:t.title,due:t.due})),electricity_balance:state.electricity.balance};
}

/** DORM OS: local-only campus calendar bridge, no account scraping or upstream app code. */
const days = {SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
const calPad=x=>String(x).padStart(2,'0');
function addDays(s,n){const d=new Date(`${s}T00:00:00Z`);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function weekday(s){return new Date(`${s}T00:00:00Z`).getUTCDay();}
function formatDate(raw){if(!/^\d{8}$/.test(raw))throw new Error('无效日历日期');const d=`${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;if(new Date(`${d}T00:00:00Z`).toISOString().slice(0,10)!==d)throw new Error('无效日期');return d;}
function unescapeIcal(x){return String(x||'').replace(/\\[nN]/g,'\n').replace(/\\([,;\\])/g,'$1').trim().slice(0,120);}
function dateTime(raw,key){
  const parts=key.split(';').slice(1);
  const zone=parts.find(x=>x.startsWith('TZID='))?.slice(5);
  if(zone && !['ASIA/SHANGHAI','ASIA/CHONGQING','ASIA/HARBIN','PRC'].includes(zone.toUpperCase()))throw new Error(`尚不支持 ${zone} 时区的课表，请导出北京时间日历`);
  const m=String(raw).match(/^(\d{8})T(\d{2})(\d{2})(\d{2})?(Z)?$/);
  if(!m)throw new Error('仅支持含具体开始和结束时间的日历课程');
  const day=formatDate(m[1]),h=Number(m[2]),min=Number(m[3]);
  if(h>23||min>59||Number(m[4]||0)>59)throw new Error('课程时间不合法');
  if(m[5]){
    const utc=new Date(`${day}T${calPad(h)}:${calPad(min)}:${m[4]||'00'}Z`);
    const local=new Date(utc.getTime()+8*3600000);
    return {date:local.toISOString().slice(0,10),time:`${calPad(local.getUTCHours())}:${calPad(local.getUTCMinutes())}`};
  }
  return {date:day,time:`${calPad(h)}:${calPad(min)}`};
}
function parseFields(lines){const o={};for(const line of lines){const ix=line.indexOf(':');if(ix<0)continue;const key=line.slice(0,ix).toUpperCase();const name=key.split(';')[0];if(!o[name])o[name]=[];o[name].push({key,value:line.slice(ix+1)});}return o;}
function field(o,k){return o[k]?.[0];}
function untilDate(x){if(!x)return null;const v=x.slice(0,8);return formatDate(v);}
function recurrence(spec){const out={};for(const p of spec.split(';')){const [k,v]=p.split('=');if(k&&v)out[k.toUpperCase()]=v;}return out;}
function parseICalendar(input){
  if(typeof input!=='string'||input.length>1024*1024)throw new Error('日历文件需小于 1MB');
  if(!input.includes('BEGIN:VCALENDAR'))throw new Error('不是有效的 iCalendar (.ics) 文件');
  const lines=input.replace(/\r\n?/g,'\n').split('\n').reduce((a,line)=>{
    if(/^[ \t]/.test(line)&&a.length)a[a.length-1]+=line.slice(1);else a.push(line);return a;
  },[]);
  const blocks=[];let block=null;
  for(const l of lines){if(l==='BEGIN:VEVENT'){block=[];}else if(l==='END:VEVENT'){if(block){blocks.push(block);block=null;}}else if(block)block.push(l);}
  if(blocks.length>400)throw new Error('日历包含过多事件，最多处理 400 条');
  const result=[],errors=[];
  for(const [index,lines] of blocks.entries()){
    try {
      const f=parseFields(lines),start=field(f,'DTSTART'),end=field(f,'DTEND');
      if(!start||!end)throw new Error('缺少开始或结束时间');
      const a=dateTime(start.value,start.key),b=dateTime(end.value,end.key);
      if(a.date!==b.date||a.time>=b.time)throw new Error('跨日期或无效的课程时间暂不支持');
      const subject=unescapeIcal(field(f,'SUMMARY')?.value);
      if(!subject)throw new Error('课程名称为空');
      const uid=String(field(f,'UID')?.value||`row-${index}`).trim().slice(0,120);
      const location=unescapeIcal(field(f,'LOCATION')?.value).slice(0,60);
      const excluded=new Set((f.EXDATE||[]).flatMap(x=>x.value.split(',').map(v=>{try{return dateTime(v,x.key).date;}catch{return '';}})));
      let occurrences=[a.date];
      if(field(f,'RRULE')){
        const rule=recurrence(field(f,'RRULE').value);
        if(rule.FREQ!=='WEEKLY')throw new Error('仅支持每周重复的课程规则');
        const interval=Number(rule.INTERVAL||1),count=rule.COUNT?Number(rule.COUNT):null,until=untilDate(rule.UNTIL);
        if(!Number.isInteger(interval)||interval<1||interval>52||count!==null&&(!Number.isInteger(count)||count<1))throw new Error('重复规则无效');
        const byDays=rule.BYDAY?rule.BYDAY.split(',').map(x=>days[x]).filter(x=>x!==undefined):[weekday(a.date)];
        if(!byDays.length)throw new Error('无法识别重复星期');
        const maxDay=until&&until<addDays(a.date,364)?until:addDays(a.date,364);
        occurrences=[];
        for(let d=a.date;d<=maxDay;d=addDays(d,1)){
          const w=Math.floor((Date.parse(`${d}T00:00:00Z`)-Date.parse(`${a.date}T00:00:00Z`))/(7*86400000));
          if(w%interval===0&&byDays.includes(weekday(d))){occurrences.push(d);if(count!==null&&occurrences.length>=count)break;}
          if(occurrences.length>=180)break;
        }
      }
      for(const day of occurrences){if(excluded.has(day))continue;result.push({id:`${uid}|${day}|${a.time}`,uid,date:day,start:a.time,end:b.time,subject:subject.slice(0,80),location,source:'iCalendar'});}
    }catch(e){errors.push(`事件 ${index+1}：${e.message}`);}
  }
  if(result.length>1200)throw new Error('日历课程展开超过 1200 条，请使用单学期导出');
  return {events:result.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),skipped:errors.length,warnings:errors.slice(0,8)};
}
function mergeCalendar(existing,incoming){const keys=new Set(existing.map(e=>e.id));const added=[];for(const ev of incoming){if(!keys.has(ev.id)){added.push(ev);keys.add(ev.id);}}return {items:[...existing,...added].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),added:added.length,duplicates:incoming.length-added.length};}
function upcomingCalendar(events,date,time,limit=8){return events.filter(e=>e.date>date||e.date===date&&e.end>time).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,limit);}

// Web NFC only handles NDEF records on compatible Android browsers.
function readerSupport({NDEFReader, isSecureContext, protocol} = {}) {
  if (!isSecureContext || protocol === 'file:') return {ok:false,reason:'Web NFC 需要在手机 Chrome 的 HTTPS 页面打开；本地 HTML 文件不支持。'};
  if (typeof NDEFReader !== 'function') return {ok:false,reason:'当前浏览器不支持 Web NFC。请用 Android 上的 Chrome 正常标签页打开。'};
  return {ok:true,reason:'浏览器支持 Web NFC 接口（实际权限还需现场验证）。'};
}
function nfcErrorMessage(error) {
  switch (error?.name) {
    case 'NotAllowedError': return 'NFC 授权被拒绝。保持 Chrome 在前台，检查 Chrome → 网站设置中的 NFC 权限、系统 NFC 开关，再从网页按钮重新发起扫描。';
    case 'NotSupportedError': return '设备或浏览器未提供兼容的 Web NFC 读取能力。系统 Tags 可以读取，也不代表 Chrome 一定可以读取。';
    case 'InvalidStateError': return '已有 NFC 扫描在运行，请先停止后重试。';
    case 'AbortError': return '已停止扫描。';
    case 'SecurityError': return '浏览器安全限制阻止了 NFC，请使用 HTTPS 页面并保持网页前台。';
    default: return '扫描启动失败，请确认已开启 NFC、网页处于前台，并检查浏览器权限。';
  }
}

function canShowSchoolAlerts(){

function publicNoticeState(){
 if(noticeStatus==='loading'&&!noticeFeed)return '正在核验官网实时公告和定时归档…';
 if(noticeStatus==='error')return noticeFeed?
  '刷新失败，以下为上次成功取得的缓存通知。':'当前无法读取学校官网，也没有有效的自动归档。';
 if(noticeStatus==='stale')return '上次成功获取的公开通知缓存；正在核验更新。';
 if(!noticeFeed)return '尚未获取到官方通知；也可以直接查看学校官网。';
 const origin=noticeApiUsed&&noticeArchiveUsed?'官网动态公告 + 定时归档':noticeArchiveUsed?'定时归档（非即时）':'官网动态公告';
 const dt=noticeUpdatedAt?new Date(noticeUpdatedAt).toLocaleString('zh-CN'):'未知';
 return (XiaoxuNotices.isStaleFeed(noticeUpdatedAt)?'历史公告，超过12小时未核验新内容 · ':'')+
  (noticePartial?'部分通知源不可用 · ':'')+origin+' · 上次取得于 '+dt+' · 已标记的新通知 '+publicUnread()+' 条';
}
async function loadPublicNotices(force=false){
 if(noticeStatus==='loading'||(!force&&noticeStatus==='ready'))return;
 restorePublicNotices();
 noticeStatus='loading';
 if(page==='academic'&&academicTab==='notices')render();
 async function getJson(url){
  const res=await fetch(url,{cache:'no-store',headers:{accept:'application/json'},signal:AbortSignal.timeout(18000)});
  if(!res.ok)throw Error(url+' HTTP '+res.status);
  return res.json();
 }
 const [api,archive]=await Promise.allSettled([
  getJson('/api/notices').then(XiaoxuNotices.fromApi),
  getJson(NOTICE_ARCHIVE_URL).then(XiaoxuNotices.fromArchive)
 ]);
 try {
  const apiVal=api.status==='fulfilled'?api.value:null;
  const archiveVal=archive.status==='fulfilled'?archive.value:null;
  if(!apiVal&&!archiveVal)throw Error('公告官网和定时归档都不可用');
  const next=XiaoxuNotices.merge(apiVal,archiveVal);
  if(next.length<2)throw Error('有效公告不足');
  const update=XiaoxuNotices.reconcileReading(noticeReading,next);
  noticeReading=update.next;persistNoticeReading();
  noticeFeed=next;noticeApiUsed=!!apiVal;noticeArchiveUsed=!!archiveVal;
  noticeApiTime=apiVal?.fetchedAt||'';noticeArchiveTime=archiveVal?.fetchedAt||'';
  noticeUpdatedAt=noticeApiTime||noticeArchiveTime||'';
  noticePartial=api.status==='rejected'||archive.status==='rejected'||apiVal?.partial===true;
  noticeFailure=noticePartial?'部分通知来源暂不可达':'';
  noticeStatus='ready';
  try{localStorage.setItem(NOTICE_CACHE_KEY,JSON.stringify({items:noticeFeed,fetchedAt:noticeUpdatedAt,
    apiTime:noticeApiTime,archiveTime:noticeArchiveTime,apiUsed:noticeApiUsed,archiveUsed:noticeArchiveUsed}));}catch{}
  if(update.added>0){toast('发现 '+update.added+' 条新的华水公开通知');void showNewSchoolAlert(update.added);}
 }catch(err) {
  noticeStatus='error';noticeFailure=String(err?.message||'不可用');
  // Only trusted previously cached data survives a network outage.
 }finally{
  if(page==='dashboard'||page==='academic'&&academicTab==='notices')render();
 }
}
function markNoticeRead(url,deferRender=false){
 noticeReading=XiaoxuNotices.markRead(noticeReading,url);persistNoticeReading();
 // Clicking an external official article must open the real link before the
 // current DOM anchor is replaced; otherwise the browser may cancel navigation.
 if(deferRender)setTimeout(()=>{if(page==='academic'||page==='dashboard')render();},0);
 else render();
}

}

function stopNfcScan({silent=false}={}){nfc.scanAttempt++;nfc.controller?.abort();nfc.controller=null;nfc.reader=null;nfc.phase='stopped';nfc.message='扫描已停止。';if(!silent&&page==='nfc')render();}
function getSceneFromNdef(message){
 for(const rec of message?.records||[]){
   if(!['url','text','absolute-url'].includes(rec.recordType))continue;
   let raw='';try{raw=new TextDecoder().decode(rec.data);}catch{continue;}
   try{
     const u=new URL(raw);
     if(!trustedDormSceneUrl(u))continue;
     const tagId=u.searchParams.get('dormTag');
     const encodedScene=u.searchParams.get('dormScene');
     const own=state.nfcTags.find(x=>x.id===tagId);
     if(own)return {scene:own.scene,label:own.name,tagId:own.id,encodedScene,stale:!!encodedScene&&encodedScene!==own.scene};
     if(sceneDefs.some(x=>x.id===encodedScene))return {scene:encodedScene,label:'未注册的场景链接',tagId:null,encodedScene,stale:false};
   }catch{continue;}
 }
 return null;
}
function trustedDormSceneUrl(u){
 const allowed=new Set([location.origin,'https://dorm-os-dk9.pages.dev','https://dorm.0701000.xyz']);

async function startNfcScan(){const support=readerSupport({NDEFReader:globalThis.NDEFReader,isSecureContext:globalThis.isSecureContext,protocol:location.protocol});if(!support.ok){nfc.phase='error';nfc.message=support.reason;render();return;}if(nfc.controller)return;
 const id=++nfc.scanAttempt;const controller=new AbortController();nfc.controller=controller;nfc.phase='starting';nfc.message='正在请求 NFC 权限……';
 try{const reader=new NDEFReader();nfc.reader=reader;

   if(id!==nfc.scanAttempt)return;

   if(!value){nfc.phase='other';nfc.message='读取到 NFC 标签，但不是本站场景链接。';if(page==='nfc')render();return;}

   }

     stopNfcScan({silent:true});

     log(`手机前台读取发现旧 NFC 场景：${value.label}`);

   }
   stopNfcScan({silent:true});
   nfc.phase='matched';
   nfc.message=`手机真实读取：${value.label}。网站场景已切换，未控制系统设置。`;
   activateScene(value.scene,'NFC 前台真实读取');setPage('scenes');toast('NFC 读取成功，网站场景已切换');
 });
 const pending=reader.scan({signal:controller.signal});render();await pending;if(id!==nfc.scanAttempt)return;nfc.phase='scanning';nfc.message='正在扫描，请将 NFC 标签靠近手机。';if(page==='nfc')render();}

async function writeNfcTag(id){
 const tag=state.nfcTags.find(x=>x.id===id);if(!tag)return;
 if(nfc.writeController){toast('已有标签正在等待写入，可先取消');return;}

 if(!support.ok){toast(support.reason);return;}
 if(!confirm(`即将把「${tag.name}」的网站链接写入 NFC 标签，可能覆盖旧的 NDEF 数据。确定继续？`))return;

   const reader=new NDEFReader();
   await reader.write({records:[{recordType:'url',data:expectedLink}]},{signal:controller.signal});
   if(idNow!==nfc.writeAttempt)return;
   // If binding changed in another tab during a pending write, do not claim a verified current binding.
   if(tag.scene!==expectedScene){nfc.phase='stale';nfc.message='标签可能写入了旧场景：绑定已经变更，请重新写入并读取验证。';return;}
   tag.writtenScene=expectedScene;tag.writtenAt=new Date().toISOString();tag.readAt='';tag.readScene='';
   nfc.phase='written';nfc.message=`「${tag.name}」NDEF 写入已确认，仍需重新扫描验证；未执行 Android 系统动作。`;
   log(`写入 NFC 链接：${tag.name}`);persist();toast('NDEF 写入完成，可重新扫描验证');

   if(idNow!==nfc.writeAttempt)return;
   nfc.phase=err?.name==='AbortError'?'stopped':'error';
   nfc.message=err?.name==='AbortError'?'本次写入已取消':nfcErrorMessage(err);

   if(idNow===nfc.writeAttempt){nfc.writeController=null;if(page==='nfc')render();}
 }
}

function tick(){const p=now();$('dateChip').textContent=`${p.month}月${p.dateNumber}日 · ${WEEKDAYS[p.day]}`;document.querySelectorAll('[data-clock]').forEach(x=>x.textContent=p.time);if($('timerDisplay'))$('timerDisplay').textContent=timerText();}
function timerText(){return `${String(Math.floor(timer.remaining/60)).padStart(2,'0')}:${String(timer.remaining%60).padStart(2,'0')}`;}
function saveTimerState(){state.focusTimer={duration:timer.duration,remaining:timer.remaining,running:timer.running,deadline:timer.deadline};persist();}
function restoreTimerState(){
 if(timer.interval)clearInterval(timer.interval);
 const restored=normalizeFocusTimer(state.focusTimer);
 Object.assign(timer,restored,{interval:null});
 if(timer.running)timer.interval=setInterval(timerSync,1000);
}
function timerSync(){
 if(!timer.running)return;
 timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));
 if(timer.remaining===0){
  timerStop();toast('本页专注计时结束（页面关闭期间不会发送系统通知）');return;
 }
 tick();
}
function timerStart(){
 if(timer.running)return;
 if(timer.remaining<=0)timer.remaining=timer.duration*60;
 timer.running=true;timer.deadline=Date.now()+timer.remaining*1000;
 timer.interval=setInterval(timerSync,1000);saveTimerState();render();
}
function timerStop(){
 if(timer.running)timer.remaining=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));
 timer.running=false;if(timer.interval)clearInterval(timer.interval);timer.interval=null;timer.deadline=0;
 saveTimerState();
}
function timerReset(){timerStop();timer.remaining=timer.duration*60;saveTimerState();render();}
function timerSetDuration(minutes){
 if(![15,25,45].includes(minutes))return;
 timerStop();timer.duration=minutes;timer.remaining=minutes*60;saveTimerState();render();
}

function escapeIcsText(value){return String(value??'').replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');}
function validIcsDate(raw){
 if(typeof raw!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(raw))return null;
 const date=new Date(raw+'T00:00:00.000Z');
 return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===raw?date:null;
}
function icsDate(date){return date.toISOString().slice(0,10).replace(/-/g,'');}
function foldIcsLine(line){
 const encoder=new TextEncoder();let out='',bytes=0;
 for(const char of String(line)){
  const length=encoder.encode(char).length;
  if(bytes+length>75){out+='\r\n ';bytes=1;}
  out+=char;bytes+=length;
 }
 return out;
}

function mergePersonalBackup(current,incoming){

 const caps={tasks:300,classes:150,calendarEvents:1200,campusLinks:30,nfcTags:60,reminders:120,items:120,sceneLinks:40};
 let added=0,conflicts=0,capacitySkipped=0;
 for(const [field,limit] of Object.entries(caps)){
   const found=new Map(data[field].map(item=>[item.id,item]));
   for(const entry of remote[field]){
     if(found.has(entry.id)){
       if(JSON.stringify(found.get(entry.id))!==JSON.stringify(entry))conflicts++;
       continue;
     }
     if(data[field].length>=limit){capacitySkipped++;continue;}
     data[field].push(entry);found.set(entry.id,entry);added++;
   }
 }
 const eventKeys=new Set(data.events.map(e=>e.at+'\n'+e.text));
 for(const e of remote.events){const k=e.at+'\n'+e.text;if(!eventKeys.has(k)){data.events.push(e);eventKeys.add(k);}}
 data.events=data.events.slice(-80);
 return {data:safeState(data),added,conflicts,capacitySkipped};
}

const ENCRYPTED_BACKUP_MARKER='dorm-os-encrypted-v1';
const BACKUP_KDF_ITERATIONS=250000;
function bytesToBase64(bytes){let str='';for(let i=0;i<bytes.length;i+=16384)str+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(str);}
function base64ToBytes(value){if(typeof value!=='string'||value.length>3000000||!/^[A-Za-z0-9+/=]+$/.test(value))throw Error('无效加密内容');return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}

async function encryptBackup(data,password){
 if(!globalThis.crypto?.subtle||typeof password!=='string'||password.length<10)throw Error('加密不可用或密码过短');
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const key=await deriveBackupKey(password,salt,BACKUP_KDF_ITERATIONS);
 const ciphertext=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data))));
 return {format:ENCRYPTED_BACKUP_MARKER,kdf:'PBKDF2-SHA256',iterations:BACKUP_KDF_ITERATIONS,cipher:'AES-256-GCM',salt:bytesToBase64(salt),iv:bytesToBase64(iv),data:bytesToBase64(ciphertext)};
}
async function decryptBackup(backup,password){
 if(!backup||backup.format!==ENCRYPTED_BACKUP_MARKER||backup.kdf!=='PBKDF2-SHA256'||backup.cipher!=='AES-256-GCM'||backup.iterations!==BACKUP_KDF_ITERATIONS)throw Error('加密格式不支持');

 if(salt.length!==16||iv.length!==12||ciphertext.length<17||ciphertext.length>2000000)throw Error('加密数据无效');
 const key=await deriveBackupKey(password,salt,backup.iterations);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext);
 return safeState(JSON.parse(new TextDecoder().decode(plain)));
}

$('taskImportInput').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try {
   if(file.size>1024*1024)throw new Error('任务快照需小于 1MB');
   const snapshot=JSON.parse(await file.text());
   const converted=snapshot?.format===globalThis.XiaoxuTaskImport.FORMAT ? {batch:snapshot,sourceFormat:'xiaoxu',unknownDeadlines:0} : globalThis.XiaoxuChaoxingCli.adaptCli(snapshot);
   const plan=globalThis.XiaoxuTaskImport.planImport(state.tasks,converted.batch,newId,new Date().toISOString(),{preserveUnknownDue:converted.sourceFormat!=='xiaoxu'});
   const titles=plan.changes.slice(0,6).map(x=>(x.type==='added'?'新增：':'更新：')+x.title).join('\n');
   const message='校序任务预览（'+plan.source+' · '+converted.sourceFormat+'）\n'+(converted.unknownDeadlines?'有 '+converted.unknownDeadlines+' 条截止时间无法确定年份，保留为空。\n':'')+'读取 '+plan.inputCount+' 条：新增 '+plan.added+'、更新 '+plan.updated+'、不变 '+plan.unchanged+'。\n'
      +(titles?titles+'\n':'')+'仅更新文件中明确列出的任务；不会删除未列出的任务，也不会自动改动本地完成勾选。\n确认导入？';
   if(!plan.changes.length){toast('任务无变化，未修改本地数据');return;}
   if(!confirm(message))return;
   const beforeTasks=state.tasks,beforeEvents=state.events.slice();
   state.tasks=plan.tasks;
   log('导入 '+plan.source+' 任务快照：新增 '+plan.added+'、更新 '+plan.updated);
   if(!persist()){state.tasks=beforeTasks;state.events=beforeEvents;return;}
   render();toast('任务导入成功：新增 '+plan.added+'、更新 '+plan.updated);
 }catch(err){toast('任务导入失败：'+(err.message||'文件格式无效'));}
 finally{e.target.value='';}
});
$('icsInput').addEventListener('change',async e=>{

   if(merged.items.length>1200)throw new Error('导入后超过 1200 条课程上限');

   if(!confirm(message))return;
