 const matches=globalSearchIndex().filter(row=>terms.every(term=>row.searchable.includes(term))).sort((a,b)=>Number(b.title.normalize('NFKC').toLocaleLowerCase('zh-CN').startsWith(query))-Number(a.title.normalize('NFKC').toLocaleLowerCase('zh-CN').startsWith(query))||a.title.localeCompare(b.title,'zh-CN'));

   if(!['url','text','absolute-url'].includes(rec.recordType))continue;

     if(sceneDefs.some(x=>x.id===encodedScene))return {scene:encodedScene,label:'未注册的场景链接',tagId:null,encodedScene,stale:false};
   }catch{continue;}

function escapeIcsText(value){return String(value??'').replace(/\\/g,'\\\\').replace(/\r\n|\r|\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');}
function validIcsDate(raw){

}

function foldIcsLine(line){

  const length=encoder.encode(char).length;
  if(bytes+length>75){out+='\r\n ';bytes=1;}
  out+=char;bytes+=length;
 }
 return out;
}

 for(const reminder of data.reminders||[])if(!reminder.done)add('reminder',reminder.id,'生活提醒：'+reminder.text,reminder.due);
 events.sort((a,b)=>a.due.localeCompare(b.due)||a.title.localeCompare(b.title));
 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DORM OS//Personal Deadlines//ZH','CALSCALE:GREGORIAN','X-WR-CALNAME:'+escapeIcsText('DORM OS 待办与截止日期'),...events.flatMap(e=>e.lines),'END:VCALENDAR'];

function parseCSV(text){const rows=[];let row=[],s='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){s+='"';i++;}else if(ch==='"')q=false;else s+=ch;}else{if(ch==='"')q=true;else if(ch===','){row.push(s);s='';}else if(ch==='\n'){row.push(s.replace(/\r$/,''));rows.push(row);row=[];s='';}else s+=ch;}}if(q)throw new Error('CSV 引号没有闭合');if(s!==''||row.length){row.push(s);rows.push(row);}const heading=rows.shift()?.map(x=>x.replace(/^\uFEFF/,'').trim())||[];const expected=['day','subject','start','end','location'];if(expected.some((x,i)=>heading[i]!==x))throw new Error('表头必须为 day,subject,start,end,location');const classes=[];for(const r of rows){if(r.every(x=>!x.trim()))continue;const days={'周日':0,'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6};const day=r[0] in days?days[r[0]]:Number(r[0]);const record={id:newId(),day,start:r[2]?.trim(),end:r[3]?.trim(),subject:r[1]?.trim(),location:r[4]?.trim()||''};if(!Number.isInteger(day)||day<0||day>6||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(record.start)||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(record.end)||record.start>=record.end||!record.subject)throw new Error(`第 ${rows.indexOf(r)+2} 行数据不符合课程格式`);classes.push(record);}if(classes.length>150)throw new Error('单次导入课程不能超过 150 条');return classes;}

function mergePersonalBackup(current,incoming){

 const caps={tasks:300,classes:150,calendarEvents:1200,campusLinks:30,nfcTags:60,reminders:120,items:120,sceneLinks:40};
 let added=0,conflicts=0,capacitySkipped=0;
 for(const [field,limit] of Object.entries(caps)){
   const found=new Map(data[field].map(item=>[item.id,item]));
   for(const entry of remote[field]){
     if(found.has(entry.id)){
       if(JSON.stringify(found.get(entry.id))!==JSON.stringify(entry))conflicts++;
       continue;
     }
     if(data[field].length>=limit){capacitySkipped++;continue;}
     data[field].push(entry);found.set(entry.id,entry);added++;
   }

 for(const e of remote.events){const k=e.at+'\n'+e.text;if(!eventKeys.has(k)){data.events.push(e);eventKeys.add(k);}}

 return {format:ENCRYPTED_BACKUP_MARKER,kdf:'PBKDF2-SHA256',iterations:BACKUP_KDF_ITERATIONS,cipher:'AES-256-GCM',salt:bytesToBase64(salt),iv:bytesToBase64(iv),data:bytesToBase64(ciphertext)};
}
async function decryptBackup(backup,password){
 if(!backup||backup.format!==ENCRYPTED_BACKUP_MARKER||backup.kdf!=='PBKDF2-SHA256'||backup.cipher!=='AES-256-GCM'||backup.iterations!==BACKUP_KDF_ITERATIONS)throw Error('加密格式不支持');
 const salt=base64ToBytes(backup.salt),iv=base64ToBytes(backup.iv),ciphertext=base64ToBytes(backup.data);
 if(salt.length!==16||iv.length!==12||ciphertext.length<17||ciphertext.length>2000000)throw Error('加密数据无效');
 const key=await deriveBackupKey(password,salt,backup.iterations);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext);
 return safeState(JSON.parse(new TextDecoder().decode(plain)));
}
