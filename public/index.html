const DEFAULT_STATE = Object.freeze({
  version: 1,
  settings: { campus: 'jianghuai', theme: 'dark' },
  tasks: [], classes: [], calendarEvents: [], campusLinks: [], events: [],
  scene: 'none',
  electricity: { balance: null, updatedAt: null }

const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const CATEGORIES = ['课程','高数','工程制图','Python','英语','生活','其他'];
const pad = n => String(n).padStart(2, '0');
function chinaParts(date = new Date()) {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'}).formatToParts(date).map(p=>[p.type,p.value]));
  const map = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {date:`${parts.year}-${parts.month}-${parts.day}`,time:`${parts.hour}:${parts.minute}`,hour:Number(parts.hour),minute:Number(parts.minute),day:map[parts.weekday],year:Number(parts.year),month:Number(parts.month),dateNumber:Number(parts.day)};

const days = {SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
const calPad=x=>String(x).padStart(2,'0');
function addDays(s,n){const d=new Date(`${s}T00:00:00Z`);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function weekday(s){return new Date(`${s}T00:00:00Z`).getUTCDay();}

function unescapeIcal(x){return String(x||'').replace(/\\[nN]/g,'\n').replace(/\\([,;\\])/g,'$1').trim().slice(0,120);}
function dateTime(raw,key){
  const parts=key.split(';').slice(1);
  const zone=parts.find(x=>x.startsWith('TZID='))?.slice(5);
  if(zone && !['ASIA/SHANGHAI','ASIA/CHONGQING','ASIA/HARBIN','PRC'].includes(zone.toUpperCase()))throw new Error(`尚不支持 ${zone} 时区的课表，请导出北京时间日历`);
  const m=String(raw).match(/^(\d{8})T(\d{2})(\d{2})(\d{2})?(Z)?$/);
  if(!m)throw new Error('仅支持含具体开始和结束时间的日历课程');
  const day=formatDate(m[1]),h=Number(m[2]),min=Number(m[3]);
  if(h>23||min>59||Number(m[4]||0)>59)throw new Error('课程时间不合法');
  if(m[5]){
    const utc=new Date(`${day}T${calPad(h)}:${calPad(min)}:${m[4]||'00'}Z`);
    const local=new Date(utc.getTime()+8*3600000);
    return {date:local.toISOString().slice(0,10),time:`${calPad(local.getUTCHours())}:${calPad(local.getUTCMinutes())}`};
  }

function parseFields(lines){const o={};for(const line of lines){const ix=line.indexOf(':');if(ix<0)continue;const key=line.slice(0,ix).toUpperCase();const name=key.split(';')[0];if(!o[name])o[name]=[];o[name].push({key,value:line.slice(ix+1)});}return o;}

function parseICalendar(input){
  if(typeof input!=='string'||input.length>1024*1024)throw new Error('日历文件需小于 1MB');
  if(!input.includes('BEGIN:VCALENDAR'))throw new Error('不是有效的 iCalendar (.ics) 文件');
  const lines=input.replace(/\r\n?/g,'\n').split('\n').reduce((a,line)=>{
    if(/^[ \t]/.test(line)&&a.length)a[a.length-1]+=line.slice(1);else a.push(line);return a;
  },[]);

  for(const l of lines){if(l==='BEGIN:VEVENT'){block=[];}else if(l==='END:VEVENT'){if(block){blocks.push(block);block=null;}}else if(block)block.push(l);}
  if(blocks.length>400)throw new Error('日历包含过多事件，最多处理 400 条');
  const result=[],errors=[];

    try {
      const f=parseFields(lines),start=field(f,'DTSTART'),end=field(f,'DTEND');
      if(!start||!end)throw new Error('缺少开始或结束时间');
      const a=dateTime(start.value,start.key),b=dateTime(end.value,end.key);
      if(a.date!==b.date||a.time>=b.time)throw new Error('跨日期或无效的课程时间暂不支持');
      const subject=unescapeIcal(field(f,'SUMMARY')?.value);
      if(!subject)throw new Error('课程名称为空');
      const uid=String(field(f,'UID')?.value||`row-${index}`).trim().slice(0,120);
      const location=unescapeIcal(field(f,'LOCATION')?.value).slice(0,60);
      const excluded=new Set((f.EXDATE||[]).flatMap(x=>x.value.split(',').map(v=>{try{return dateTime(v,x.key).date;}catch{return '';}})));

      if(field(f,'RRULE')){

        const interval=Number(rule.INTERVAL||1),count=rule.COUNT?Number(rule.COUNT):null,until=untilDate(rule.UNTIL);

          if(occurrences.length>=180)break;
        }
      }
      for(const day of occurrences){if(excluded.has(day))continue;result.push({id:`${uid}|${day}|${a.time}`,uid,date:day,start:a.time,end:b.time,subject:subject.slice(0,80),location,source:'iCalendar'});}
    }catch(e){errors.push(`事件 ${index+1}：${e.message}`);}
  }
  if(result.length>1200)throw new Error('日历课程展开超过 1200 条，请使用单学期导出');
  return {events:result.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),skipped:errors.length,warnings:errors.slice(0,8)};
}

const XIAOMI_CONNECT_TYPE = 'com.xiaomi.mi_connect_service:externaltype';
function canonicalRecordType(value) {
  const text = String(value ?? '').trim().toLowerCase();

    ? text.slice('vnd.android.nfc://ext/'.length)

function isXiaomiLaptopRecord(record) {

  if (typeof NDEFReader !== 'function') return {ok:false,reason:'当前浏览器不支持 Web NFC。请用 Android 上的 Chrome 正常标签页打开。'};

function stopNfcScan({silent=false}={}) {
 nfc.scanAttempt++;
 nfc.controller?.abort(); nfc.controller=null; nfc.reader=null;
 nfc.phase='stopped'; nfc.message='扫描已经停止；笔记本标签没有被修改。';
 if(!silent&&page==='nfc')render();

async function startNfcScan(){
 const support=readerSupport({NDEFReader:globalThis.NDEFReader,isSecureContext:globalThis.isSecureContext,protocol:location.protocol});
 if(!support.ok){nfc.phase='error';nfc.message=support.reason;render();return;}
 if(nfc.controller){return;}
 const id=++nfc.scanAttempt;
 const controller=new AbortController();nfc.controller=controller;nfc.phase='starting';nfc.message='正在向 Chrome 请求 NFC 读取权限……';
 // Call scan during the original click activation, before any unrelated await.
 try {
   const reader=new NDEFReader();nfc.reader=reader;
   reader.addEventListener('readingerror',()=>{if(id!==nfc.scanAttempt)return;nfc.message='标签经过感应区，但浏览器无法解码 NDEF。';nfc.phase='scanning';if(page==='nfc')render();});
   reader.addEventListener('reading',event=>{
     if(id!==nfc.scanAttempt)return;
     if(!containsXiaomiLaptopRecord(event.message?.records)){
       nfc.phase='scanning';nfc.message='成功读到 NFC，但不是预期的小米互联外部类型记录。没有切换场景；继续扫描中。';nfc.lastRead='其他 NDEF 记录';if(page==='nfc')render();return;
     }
     nfc.phase='matched';nfc.lastRead='小米互联 externaltype';
     nfc.message=`已识别小米互联记录类型：网站切换为「${sceneLabel(nfc.scene)}」。`;
     if(nfc.scene!=='study')timerStop();state.scene=nfc.scene;
     log(`NFC 前台扫描切换网站场景为「${sceneLabel(nfc.scene)}」（未控制系统或电脑）`);
     persist();
     stopNfcScan({silent:true});
     nfc.phase='matched';nfc.message=`检测到小米互联类型的 NFC 记录，已切换网站场景为「${sceneLabel(state.scene)}」。`;
     setPage('scenes');toast('NFC 已识别，网页学习场景已切换');
   });
   const scanning=reader.scan({signal:controller.signal});
   render();
   await scanning;
   if(id!==nfc.scanAttempt)return;
   nfc.phase='scanning';nfc.message='扫描已启动！请保持 Chrome 前台，再将手机靠近笔记本 NFC 区域。';
   if(page==='nfc')render();
 }catch(err){
   if(id!==nfc.scanAttempt)return;
   nfc.controller=null;nfc.reader=null;
   nfc.phase=err.name==='AbortError'?'stopped':'error';nfc.message=nfcErrorMessage(err);
   if(page==='nfc')render();
 }
}
function render(){const pages={dashboard,timetable,campus:campusPage,tasks:tasksPage,scenes:scenesPage,devices:devicesPage,settings:settingsPage,nfc:nfcPage};$('app').innerHTML=pages[page]();document.querySelectorAll('[data-page]').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false');});$('breadcrumb').textContent=nameMap[page];$('campusChip').textContent=CAMPUSES[state.settings.campus].name;document.documentElement.classList.toggle('theme-light',state.settings.theme==='light');tick();}
function setPage(next){if(!nameMap[next])return;if(page==='nfc'&&next!=='nfc'&&nfc.controller)stopNfcScan({silent:true});page=next;history.replaceState(null,'',`#${next}`);render();window.scrollTo({top:0,behavior:'instant'});}
function tick(){const p=now();$('dateChip').textContent=`${p.month}月${p.dateNumber}日 · ${WEEKDAYS[p.day]}`;document.querySelectorAll('[data-clock]').forEach(x=>x.textContent=p.time);if($('timerDisplay'))$('timerDisplay').textContent=timerText();}
function timerText(){return `${String(Math.floor(timer.remaining/60)).padStart(2,'0')}:${String(timer.remaining%60).padStart(2,'0')}`;}
function timerStart(){if(timer.running)return;timer.running=true;timer.interval=setInterval(()=>{if(timer.remaining>0)timer.remaining--;else{timerStop();toast('本页专注计时结束');}tick();},1000);render();}
function timerStop(){timer.running=false;if(timer.interval)clearInterval(timer.interval);timer.interval=null;}
function openDialog(html){$('editorContent').innerHTML=html;$('editor').showModal();}
function formFrame(title,body){return `<form id="modalForm"><h2>${esc(title)}</h2>${body}<div class="modal-actions"><button type="button" class="secondary" data-action="close-modal">取消</button><button type="submit" class="primary">保存</button></div></form>`;}
function taskDialog(id){const t=state.tasks.find(x=>x.id===id);openDialog(formFrame(t?'编辑任务':'新增任务',`<input name="id" type="hidden" value="${esc(t?.id||'')}"><div class="form-field"><label for="taskTitle">任务名称 *</label><input id="taskTitle" name="title" maxlength="100" required placeholder="例如：完成高数作业" value="${esc(t?.title||'')}"></div><div class="grid-fields"><div class="form-field"><label for="taskCategory">类别</label><select name="category" id="taskCategory">${CATEGORIES.map(c=>`<option ${t?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="form-field"><label for="taskDue">截止日期（可选）</label><input id="taskDue" type="date" name="due" value="${esc(t?.due||'')}"></div></div>`));$('modalForm').dataset.form='task';$('taskTitle').focus();}
function classDialog(id){const c=state.classes.find(x=>x.id===id);openDialog(formFrame(c?'编辑课程':'添加课程',`<input name="id" type="hidden" value="${esc(c?.id||'')}"><div class="form-field"><label for="classSubject">课程名称 *</label><input id="classSubject" name="subject" maxlength="80" placeholder="例如：高等数学" required value="${esc(c?.subject||'')}"></div><div class="grid-fields"><div class="form-field"><label>星期</label><select name="day">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${c?.day===d?'selected':''}>${WEEKDAYS[d]}</option>`).join('')}</select></div><div class="form-field"><label>教室</label><input name="location" maxlength="60" placeholder="如教学楼 A201" value="${esc(c?.location||'')}"></div></div><div class="grid-fields"><div class="form-field"><label>开始时间</label><input name="start" type="time" required value="${esc(c?.start||'08:00')}"></div><div class="form-field"><label>结束时间</label><input name="end" type="time" required value="${esc(c?.end||'09:40')}"></div></div>`));$('modalForm').dataset.form='class';$('classSubject').focus();}
function balanceDialog(){openDialog(formFrame('手动记录宿舍电费',`<p class="small muted">这里只保存你主动输入的数值，不连接学校收费系统。</p><div class="form-field"><label>电费余额（人民币）</label><input name="balance" type="number" min="0" max="99999" step="0.01" required value="${state.electricity.balance??''}" placeholder="例如 35.50"></div>`));$('modalForm').dataset.form='balance';}
function processForm(form){const d=new FormData(form);if(form.dataset.form==='task'){const title=String(d.get('title')||'').trim().slice(0,100);if(!title){toast('请输入任务名称');return;}const id=String(d.get('id')||'');const current=state.tasks.find(x=>x.id===id);const record={id:current?.id||newId(),title,category:CATEGORIES.includes(d.get('category'))?d.get('category'):'其他',due:String(d.get('due')||''),done:current?.done||false,createdAt:current?.createdAt||new Date().toISOString()};if(current)Object.assign(current,record);else state.tasks.push(record);log(`${current?'修改':'新增'}任务：${title}`);}else if(form.dataset.form==='class'){const subject=String(d.get('subject')||'').trim().slice(0,80),start=d.get('start'),end=d.get('end');if(!subject||!start||!end||start>=end){toast('请检查课程名称及时间顺序');return;}const id=String(d.get('id')||'');const current=state.classes.find(x=>x.id===id);const record={id:current?.id||newId(),subject,day:Number(d.get('day')),start,end,location:String(d.get('location')||'').trim().slice(0,60)};if(current)Object.assign(current,record);else state.classes.push(record);log(`${current?'修改':'新增'}课程：${subject}`);}else if(form.dataset.form==='campus-link'){const name=String(d.get('name')||'').trim().slice(0,40),url=String(d.get('url')||'').trim();if(!name||!/^https:\/\/[^\s/]+(?:\/[^\s]*)?$/.test(url)||url.length>300){toast('请输入有效 HTTPS 地址和服务名称');return;}if(state.campusLinks.length>=30){toast('自定义入口最多 30 个');return;}state.campusLinks.push({id:newId(),name,url});log(`添加校园服务：${name}`);} else if(form.dataset.form==='balance'){const raw=String(d.get('balance')||'');const n=Number(raw);if(raw===''||!Number.isFinite(n)||n<0||n>99999){toast('请输入有效的非负余额');return;}state.electricity={balance:Math.round(n*100)/100,updatedAt:new Date().toISOString()};log('手动更新电费余额');}
  persist();$('editor').close();render();toast('已保存到当前浏览器');}
function weatherCacheKey(){return `dorm-os-weather-${state.settings.campus}`;}
function loadWeather(){try{const raw=localStorage.getItem(weatherCacheKey());weather=raw?JSON.parse(raw):null;}catch{weather=null;}}
async function fetchWeather(force=false){if(weatherLoading)return;const key=weatherCacheKey();loadWeather();if(!force && weather && Date.now()-new Date(weather.fetchedAt).getTime()<30*60*1000){render();return;}
  weatherLoading=true;weatherError='';render();const campus=CAMPUSES[state.settings.campus],currentKey=state.settings.campus;
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);
  try{const url=new URL('https://api.open-meteo.com/v1/forecast');url.search=new URLSearchParams({latitude:String(campus.lat),longitude:String(campus.lon),current:'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code',daily:'temperature_2m_max,temperature_2m_min,precipitation_probability_max',forecast_days:'1',timezone:'Asia/Shanghai'}).toString();const resp=await fetch(url,{signal:controller.signal,cache:'no-store'});if(!resp.ok)throw new Error(`HTTP ${resp.status}`);const data=await resp.json();if(!Number.isFinite(data.current?.temperature_2m)||!Number.isFinite(data.current?.apparent_temperature))throw new Error('天气数据无效');const item={temp:data.current.temperature_2m,feels:data.current.apparent_temperature,code:data.current.weather_code,rain:data.current.precipitation??0,humidity:data.current.relative_humidity_2m??null,rainChance:data.daily?.precipitation_probability_max?.[0]??0,max:data.daily?.temperature_2m_max?.[0]??data.current.temperature_2m,min:data.daily?.temperature_2m_min?.[0]??data.current.temperature_2m,fetchedAt:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(item));if(state.settings.campus===currentKey){weather=item;weatherError='';}}
  catch(e){if(state.settings.campus===currentKey){weatherError=weather?'联网失败，仍显示上次缓存。':`获取失败（${e.name==='AbortError'?'请求超时':'检查网络连接'}），稍后可重试。`;}}
  finally{clearTimeout(timeout);weatherLoading=false;render();}}
function parseCSV(text){const rows=[];let row=[],s='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){s+='"';i++;}else if(ch==='"')q=false;else s+=ch;}else{if(ch==='"')q=true;else if(ch===','){row.push(s);s='';}else if(ch==='\n'){row.push(s.replace(/\r$/,''));rows.push(row);row=[];s='';}else s+=ch;}}if(q)throw new Error('CSV 引号没有闭合');if(s!==''||row.length){row.push(s);rows.push(row);}const heading=rows.shift()?.map(x=>x.replace(/^\uFEFF/,'').trim())||[];const expected=['day','subject','start','end','location'];if(expected.some((x,i)=>heading[i]!==x))throw new Error('表头必须为 day,subject,start,end,location');const classes=[];for(const r of rows){if(r.every(x=>!x.trim()))continue;const days={'周日':0,'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6};const day=r[0] in days?days[r[0]]:Number(r[0]);const record={id:newId(),day,start:r[2]?.trim(),end:r[3]?.trim(),subject:r[1]?.trim(),location:r[4]?.trim()||''};if(!Number.isInteger(day)||day<0||day>6||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(record.start)||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(record.end)||record.start>=record.end||!record.subject)throw new Error(`第 ${rows.indexOf(r)+2} 行数据不符合课程格式`);classes.push(record);}if(classes.length>150)throw new Error('单次导入课程不能超过 150 条');return classes;}
async function csvImport(){const f=document.createElement('input');f.type='file';f.accept='.csv,text/csv';f.onchange=async()=>{if(!f.files?.length)return;try{const text=await f.files[0].text();const rows=parseCSV(text);if(!rows.length){toast('文件中没有有效课程');return;}if(state.classes.length+rows.length>150)throw new Error('总课程数超过 150');if(!confirm(`即将追加 ${rows.length} 门周课表课程，确定吗？`))return;state.classes.push(...rows);log(`导入 ${rows.length} 条 CSV 课程`);persist();render();toast(`成功导入 ${rows.length} 条课程`);}catch(e){toast(`导入失败：${e.message}`);}};f.click();}
function exportedBackup(){return JSON.stringify(state,null,2);}
function clickAction(action){if(action==='add-task')taskDialog();else if(action==='add-class')classDialog();else if(action==='balance')balanceDialog();else if(action==='close-modal')$('editor').close();else if(action==='refresh-weather')fetchWeather(true);else if(action==='export'){download(`dorm-os-backup-${now().date}.json`,exportedBackup());toast('已下载备份文件');}else if(action==='import')$('importInput').click();else if(action==='eink-export'){download(`dorm-os-eink-${now().date}.json`,JSON.stringify(eInkPayload(state,weather),null,2));toast('已导出墨水屏数据快照（非实时接口）');}else if(action==='csv-template'){download('dorm-os-course-template.csv','day,subject,start,end,location\n1,示例课程,08:00,09:40,示例教室\n','text/csv');toast('已下载 CSV 模板，请替换示例内容');}else if(action==='csv-import')csvImport();else if(action==='ics-import')icsImport();else if(action==='add-campus-link')campusLinkDialog();else if(action==='clear-calendar'){if(state.calendarEvents.length&&confirm('确定删除当前浏览器中全部导入的日历课程？')){state.calendarEvents=[];log('清空导入的日历课程');persist();render();toast('已清空导入课程');}}else if(action==='reset'){if(confirm('确定删除本浏览器所有 DORM OS 课程、任务和设置吗？此操作不能撤销。')){state=structuredClone(DEFAULT_STATE);persist();weather=null;loadWeather();setPage('dashboard');toast('已清空本地数据');}}else if(action==='nfc-start')startNfcScan();else if(action==='nfc-stop')stopNfcScan();else if(action==='timer-toggle'){timer.running?timerStop():timerStart();render();}else if(action==='timer-reset'){timerStop();timer.remaining=25*60;render();}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action], [data-page], [data-scene], [data-task-edit], [data-task-delete], [data-class-edit], [data-class-delete], [data-campus-link-delete], [data-filter]');if(!target)return;
  if(target.dataset.page){e.preventDefault();setPage(target.dataset.page);}else if(target.dataset.action)clickAction(target.dataset.action);else if(target.dataset.filter){taskFilter=target.dataset.filter;render();}else if(target.dataset.scene){if(target.dataset.scene!=='study')timerStop();state.scene=target.dataset.scene;log(`网页场景切换为「${sceneLabel(state.scene)}」（未触发外部设备）`);persist();render();toast('网站场景已切换；外部设备未执行控制');}else if(target.dataset.taskEdit)taskDialog(target.dataset.taskEdit);else if(target.dataset.classEdit)classDialog(target.dataset.classEdit);else if(target.dataset.taskDelete){const t=state.tasks.find(x=>x.id===target.dataset.taskDelete);if(t&&confirm(`删除任务「${t.title}」？`)){state.tasks=state.tasks.filter(x=>x.id!==t.id);log(`删除任务：${t.title}`);persist();render();}}else if(target.dataset.campusLinkDelete){const link=state.campusLinks.find(x=>x.id===target.dataset.campusLinkDelete);if(link&&confirm(`删除校园服务「${link.name}」？`)){state.campusLinks=state.campusLinks.filter(x=>x.id!==link.id);persist();render();toast('服务入口已删除');}}else if(target.dataset.classDelete){const c=state.classes.find(x=>x.id===target.dataset.classDelete);if(c&&confirm(`删除课程「${c.subject}」？`)){state.classes=state.classes.filter(x=>x.id!==c.id);log(`删除课程：${c.subject}`);persist();render();}}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-task-toggle]')){const t=state.tasks.find(x=>x.id===el.dataset.taskToggle);if(t){t.done=el.checked;log(`${t.done?'完成':'恢复'}任务：${t.title}`);persist();render();}}else if(el.id==='nfcScene'){if(['study','rest','away'].includes(el.value))nfc.scene=el.value;}else if(el.id==='campusSelect'){state.settings.campus=el.value in CAMPUSES?el.value:'jianghuai';persist();weather=null;loadWeather();render();fetchWeather();}else if(el.id==='themeSelect'){state.settings.theme=el.value==='light'?'light':'dark';persist();render();}});
document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();processForm(e.target);}});
$('quickAdd').addEventListener('click',()=>taskDialog());
$('icsInput').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
   if(file.size>1024*1024)throw new Error('请使用小于 1MB 的 .ics 日历文件');
   const parsed=parseICalendar(await file.text());
   if(!parsed.events.length){toast(parsed.warnings[0]||'日历中没有可识别的课程');return;}
   const merged=mergeCalendar(state.calendarEvents,parsed.events);
   if(merged.items.length>1200)throw new Error('导入后超过 1200 条课程上限');
   const message=`识别 ${parsed.events.length} 条日期课程\n新增 ${merged.added} 条，重复 ${merged.duplicates} 条，跳过 ${parsed.skipped} 条。\n确定导入吗？`;
   if(!confirm(message))return;
   state.calendarEvents=merged.items;log(`导入教务 iCalendar：新增 ${merged.added} 条，跳过 ${parsed.skipped} 条`);persist();render();
   toast(`导入完成：新增 ${merged.added} 条${parsed.skipped?'，有部分无法识别':''}`);
   if(parsed.warnings.length)alert('未识别事件（最多显示 8 条）：\n'+parsed.warnings.join('\n'));
 }catch(err){toast(`日历导入失败：${err.message}`);}finally{e.target.value='';}
});
$('importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>1024*1024)throw new Error('备份大于 1MB，拒绝导入');const parsed=safeState(JSON.parse(await file.text()));if(!confirm('恢复将覆盖当前浏览器中所有任务、课表和设置，确定继续吗？'))return;state=parsed;persist();weather=null;loadWeather();setPage('dashboard');toast('备份恢复成功');}catch(err){toast(`恢复失败：${err.message}`);}finally{e.target.value='';}});
$('editor').addEventListener('click',e=>{if(e.target===$('editor'))$('editor').close();});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(nameMap[h]&&h!==page){page=h;render();}});
window.addEventListener('online',()=>fetchWeather());
page=nameMap[location.hash.slice(1)]?location.hash.slice(1):'dashboard';
loadWeather();render();fetchWeather();setInterval(tick,10000);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
