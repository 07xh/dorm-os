<script>
const TZ = 'Asia/Shanghai';
const CAMPUSES = Object.freeze({
  jianghuai: { name: '江淮校区', city: '罗山', lat: 32.20, lon: 114.53 },
  huayuan: { name: '花园校区', city: '郑州', lat: 34.78, lon: 113.65 }
});
const DEFAULT_STATE = Object.freeze({
  version: 1,
  settings: { campus: 'jianghuai', theme: 'light' },
  tasks: [], classes: [], calendarEvents: [], campusLinks: [], events: [], nfcTags: [], reminders: [], items: [],
  scene: 'none',
  electricity: { balance: null, updatedAt: null }
});
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
const CATEGORIES = ['课程','高数','工程制图','Python','英语','生活','其他'];
const pad = n => String(n).padStart(2, '0');
function chinaParts(date = new Date()) {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'}).formatToParts(date).map(p=>[p.type,p.value]));
  const map = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {date:`${parts.year}-${parts.month}-${parts.day}`,time:`${parts.hour}:${parts.minute}`,hour:Number(parts.hour),minute:Number(parts.minute),day:map[parts.weekday],year:Number(parts.year),month:Number(parts.month),dateNumber:Number(parts.day)};
}
function safeState(value){
  if (!value || typeof value !== 'object' || Array.isArray(value) || value.version !== 1) throw new Error('不是受支持的 DORM OS V1 备份');
  const campus = CAMPUSES[value.settings?.campus] ? value.settings.campus : 'jianghuai';
  const cleanText = (x,max=100) => String(x??'').trim().slice(0,max);
  const dateRE = /^\d{4}-\d{2}-\d{2}$/;
  const timeRE = /^([01]\d|2[0-3]):[0-5]\d$/;
  const tasks = (Array.isArray(value.tasks)?value.tasks:[]).slice(0,300).filter(x=>x && typeof x==='object').map((x,i)=>({
    id:cleanText(x.id,60)||`task-${i}`,title:cleanText(x.title,100),category:CATEGORIES.includes(x.category)?x.category:'其他',due:dateRE.test(x.due)?x.due:'',done:x.done===true,createdAt:cleanText(x.createdAt,40)
  })).filter(x=>x.title);
  const classes = (Array.isArray(value.classes)?value.classes:[]).slice(0,150).filter(x=>x && typeof x==='object' && Number.isInteger(x.day) && x.day>=0 && x.day<=6 && timeRE.test(x.start) && timeRE.test(x.end) && x.start<x.end).map((x,i)=>({
    id:cleanText(x.id,60)||`class-${i}`,day:x.day,start:x.start,end:x.end,subject:cleanText(x.subject,80),location:cleanText(x.location,60)
  })).filter(x=>x.subject);
  const calendarEvents = (Array.isArray(value.calendarEvents)?value.calendarEvents:[]).slice(0,1200).filter(x=>x&&typeof x==='object'&&dateRE.test(x.date)&&timeRE.test(x.start)&&timeRE.test(x.end)&&x.start<x.end).map((x,i)=>({id:cleanText(x.id,180)||`event-${i}`,uid:cleanText(x.uid,120),date:x.date,start:x.start,end:x.end,subject:cleanText(x.subject,80),location:cleanText(x.location,60),source:'iCalendar'})).filter(x=>x.subject);
  const campusLinks=(Array.isArray(value.campusLinks)?value.campusLinks:[]).slice(0,30).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,60)||`link-${i}`,name:cleanText(x.name,40),url:cleanText(x.url,300)})).filter(x=>x.name&&/^https:\/\/[^\s/]+(?:\/[^\s]*)?$/.test(x.url));
  const nfcTags = (Array.isArray(value.nfcTags)?value.nfcTags:[]).slice(0,60).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,80)||`tag-${i}`,name:cleanText(x.name,40),scene:['study','rest','dev','away'].includes(x.scene)?x.scene:'study',createdAt:cleanText(x.createdAt,40),writtenScene:['study','rest','dev','away'].includes(x.writtenScene)?x.writtenScene:'',writtenAt:cleanText(x.writtenAt,40),readAt:cleanText(x.readAt,40),readScene:['study','rest','dev','away'].includes(x.readScene)?x.readScene:''})).filter(x=>x.name);
  const reminders = (Array.isArray(value.reminders)?value.reminders:[]).slice(0,120).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,60)||`reminder-${i}`,text:cleanText(x.text,100),due:dateRE.test(x.due)?x.due:'',done:x.done===true})).filter(x=>x.text);
  const items = (Array.isArray(value.items)?value.items:[]).slice(0,120).filter(x=>x&&typeof x==='object').map((x,i)=>({id:cleanText(x.id,60)||`item-${i}`,name:cleanText(x.name,80),place:cleanText(x.place,80)})).filter(x=>x.name);
  const events = (Array.isArray(value.events)?value.events:[]).slice(-80).filter(x=>x&&typeof x==='object').map(x=>({at:cleanText(x.at,40),text:cleanText(x.text,120)}));
  const amount = value.electricity?.balance;
  return {version:1,settings:{campus,theme:value.settings?.theme==='dark'?'dark':'light'},tasks,classes,calendarEvents,campusLinks,events,nfcTags,reminders,items,scene:['none','study','rest','dev','away'].includes(value.scene)?value.scene:'none',electricity:{balance:typeof amount==='number' && Number.isFinite(amount) && amount>=0 && amount<100000?amount:null,updatedAt:cleanText(value.electricity?.updatedAt,40)||null}};
}
function classForDay(classes, day) {return classes.filter(x=>x.day===day).sort((a,b)=>a.start.localeCompare(b.start));}
function upcomingClass(classes, day, time) {
  for(let offset=0;offset<=7;offset++) {
    const target=(day+offset)%7;
    const eligible=classForDay(classes,target).filter(c=>offset>0||c.end>time);
    if(eligible.length) return {...eligible[0],daysAway:offset};
  }
  return null;
}
function taskSummary(tasks,today) {
  const remaining=tasks.filter(t=>!t.done);
  return {remaining:remaining.length,dueToday:remaining.filter(t=>t.due===today).length,overdue:remaining.filter(t=>t.due && t.due<today).length};
}
function weatherInfo(code) {
  if(code===0) return {name:'晴',icon:'☀️'};
  if([1,2,3].includes(code)) return {name:'多云',icon:'⛅'};
  if([45,48].includes(code)) return {name:'有雾',icon:'🌫️'};
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return {name:'有雨',icon:'🌧️'};
  if([71,73,75,77,85,86].includes(code)) return {name:'有雪',icon:'🌨️'};
  if([95,96,99].includes(code)) return {name:'雷雨',icon:'⛈️'};
  return {name:'天气未知',icon:'🌤️'};
}
function weatherAdvice(weather) {
  if(!weather) return '联网后显示出门建议';
  if(weather.rainChance>=55 || weather.rain>0) return '有降水可能，出门带伞';
  if(weather.feels<10) return '体感较冷，注意保暖';
  if(weather.feels>=30) return '体感炎热，注意补水';
  return '出门前查看课程与随身物品';
}
function eInkPayload(state,weather, now=new Date()) {
  const p=chinaParts(now), cls=upcomingClass(state.classes,p.day,p.time);
  return {schema:'dorm-os/eink-v1',generated_at:now.toISOString(),timezone:TZ,campus:state.settings.campus,location:CAMPUSES[state.settings.campus].city,clock:p.time,date:p.date,weather:weather?{temp:weather.temp,feels:weather.feels,description:weatherInfo(weather.code).name,last_updated:weather.fetchedAt}:null,next_class:cls?{subject:cls.subject,location:cls.location,start:cls.start,day:cls.day}:null,tasks:state.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,3).map(t=>({title:t.title,due:t.due})),electricity_balance:state.electricity.balance};
}

/** DORM OS: local-only campus calendar bridge, no account scraping or upstream app code. */
const days = {SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
const calPad=x=>String(x).padStart(2,'0');
function addDays(s,n){const d=new Date(`${s}T00:00:00Z`);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function weekday(s){return new Date(`${s}T00:00:00Z`).getUTCDay();}
function formatDate(raw){if(!/^\d{8}$/.test(raw))throw new Error('无效日历日期');const d=`${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;if(new Date(`${d}T00:00:00Z`).toISOString().slice(0,10)!==d)throw new Error('无效日期');return d;}
function unescapeIcal(x){return String(x||'').replace(/\\[nN]/g,'\n').replace(/\\([,;\\])/g,'$1').trim().slice(0,120);}
function dateTime(raw,key){
  const parts=key.split(';').slice(1);
  const zone=parts.find(x=>x.startsWith('TZID='))?.slice(5);
  if(zone && !['ASIA/SHANGHAI','ASIA/CHONGQING','ASIA/HARBIN','PRC'].includes(zone.toUpperCase()))throw new Error(`尚不支持 ${zone} 时区的课表，请导出北京时间日历`);
  const m=String(raw).match(/^(\d{8})T(\d{2})(\d{2})(\d{2})?(Z)?$/);
  if(!m)throw new Error('仅支持含具体开始和结束时间的日历课程');
  const day=formatDate(m[1]),h=Number(m[2]),min=Number(m[3]);
  if(h>23||min>59||Number(m[4]||0)>59)throw new Error('课程时间不合法');
  if(m[5]){
    const utc=new Date(`${day}T${calPad(h)}:${calPad(min)}:${m[4]||'00'}Z`);
    const local=new Date(utc.getTime()+8*3600000);
    return {date:local.toISOString().slice(0,10),time:`${calPad(local.getUTCHours())}:${calPad(local.getUTCMinutes())}`};
  }
  return {date:day,time:`${calPad(h)}:${calPad(min)}`};
}
function parseFields(lines){const o={};for(const line of lines){const ix=line.indexOf(':');if(ix<0)continue;const key=line.slice(0,ix).toUpperCase();const name=key.split(';')[0];if(!o[name])o[name]=[];o[name].push({key,value:line.slice(ix+1)});}return o;}
function field(o,k){return o[k]?.[0];}
function untilDate(x){if(!x)return null;const v=x.slice(0,8);return formatDate(v);}
function recurrence(spec){const out={};for(const p of spec.split(';')){const [k,v]=p.split('=');if(k&&v)out[k.toUpperCase()]=v;}return out;}
function parseICalendar(input){
  if(typeof input!=='string'||input.length>1024*1024)throw new Error('日历文件需小于 1MB');
  if(!input.includes('BEGIN:VCALENDAR'))throw new Error('不是有效的 iCalendar (.ics) 文件');
  const lines=input.replace(/\r\n?/g,'\n').split('\n').reduce((a,line)=>{
    if(/^[ \t]/.test(line)&&a.length)a[a.length-1]+=line.slice(1);else a.push(line);return a;
  },[]);
  const blocks=[];let block=null;
  for(const l of lines){if(l==='BEGIN:VEVENT'){block=[];}else if(l==='END:VEVENT'){if(block){blocks.push(block);block=null;}}else if(block)block.push(l);}
  if(blocks.length>400)throw new Error('日历包含过多事件，最多处理 400 条');
  const result=[],errors=[];
  for(const [index,lines] of blocks.entries()){
    try {
      const f=parseFields(lines),start=field(f,'DTSTART'),end=field(f,'DTEND');
      if(!start||!end)throw new Error('缺少开始或结束时间');
      const a=dateTime(start.value,start.key),b=dateTime(end.value,end.key);
      if(a.date!==b.date||a.time>=b.time)throw new Error('跨日期或无效的课程时间暂不支持');
      const subject=unescapeIcal(field(f,'SUMMARY')?.value);
      if(!subject)throw new Error('课程名称为空');
      const uid=String(field(f,'UID')?.value||`row-${index}`).trim().slice(0,120);
      const location=unescapeIcal(field(f,'LOCATION')?.value).slice(0,60);
      const excluded=new Set((f.EXDATE||[]).flatMap(x=>x.value.split(',').map(v=>{try{return dateTime(v,x.key).date;}catch{return '';}})));
      let occurrences=[a.date];
      if(field(f,'RRULE')){
        const rule=recurrence(field(f,'RRULE').value);
        if(rule.FREQ!=='WEEKLY')throw new Error('仅支持每周重复的课程规则');
        const interval=Number(rule.INTERVAL||1),count=rule.COUNT?Number(rule.COUNT):null,until=untilDate(rule.UNTIL);
        if(!Number.isInteger(interval)||interval<1||interval>52||count!==null&&(!Number.isInteger(count)||count<1))throw new Error('重复规则无效');
        const byDays=rule.BYDAY?rule.BYDAY.split(',').map(x=>days[x]).filter(x=>x!==undefined):[weekday(a.date)];
        if(!byDays.length)throw new Error('无法识别重复星期');
        const maxDay=until&&until<addDays(a.date,364)?until:addDays(a.date,364);
        occurrences=[];
        for(let d=a.date;d<=maxDay;d=addDays(d,1)){
          const w=Math.floor((Date.parse(`${d}T00:00:00Z`)-Date.parse(`${a.date}T00:00:00Z`))/(7*86400000));
          if(w%interval===0&&byDays.includes(weekday(d))){occurrences.push(d);if(count!==null&&occurrences.length>=count)break;}
          if(occurrences.length>=180)break;
        }
      }
      for(const day of occurrences){if(excluded.has(day))continue;result.push({id:`${uid}|${day}|${a.time}`,uid,date:day,start:a.time,end:b.time,subject:subject.slice(0,80),location,source:'iCalendar'});}
    }catch(e){errors.push(`事件 ${index+1}：${e.message}`);}
  }
  if(result.length>1200)throw new Error('日历课程展开超过 1200 条，请使用单学期导出');
  return {events:result.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),skipped:errors.length,warnings:errors.slice(0,8)};
}
function mergeCalendar(existing,incoming){const keys=new Set(existing.map(e=>e.id));const added=[];for(const ev of incoming){if(!keys.has(ev.id)){added.push(ev);keys.add(ev.id);}}return {items:[...existing,...added].sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),added:added.length,duplicates:incoming.length-added.length};}
function upcomingCalendar(events,date,time,limit=8){return events.filter(e=>e.date>date||e.date===date&&e.end>time).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,limit);}

// Web NFC only handles NDEF records on compatible Android browsers.
function readerSupport({NDEFReader, isSecureContext, protocol} = {}) {
  if (!isSecureContext || protocol === 'file:') return {ok:false,reason:'Web NFC 需要在手机 Chrome 的 HTTPS 页面打开；本地 HTML 文件不支持。'};
  if (typeof NDEFReader !== 'function') return {ok:false,reason:'当前浏览器不支持 Web NFC。请用 Android 上的 Chrome 正常标签页打开。'};
  return {ok:true,reason:'浏览器支持 Web NFC 接口（实际权限还需现场验证）。'};
}
function nfcErrorMessage(error) {
  switch (error?.name) {
    case 'NotAllowedError': return 'NFC 授权被拒绝。保持 Chrome 在前台，检查 Chrome → 网站设置中的 NFC 权限、系统 NFC 开关，再从网页按钮重新发起扫描。';
    case 'NotSupportedError': return '设备或浏览器未提供兼容的 Web NFC 读取能力。系统 Tags 可以读取，也不代表 Chrome 一定可以读取。';
    case 'InvalidStateError': return '已有 NFC 扫描在运行，请先停止后重试。';
    case 'AbortError': return '已停止扫描。';
    case 'SecurityError': return '浏览器安全限制阻止了 NFC，请使用 HTTPS 页面并保持网页前台。';
    default: return '扫描启动失败，请确认已开启 NFC、网页处于前台，并检查浏览器权限。';
  }
}

function stopNfcScan({silent=false}={}){nfc.scanAttempt++;nfc.controller?.abort();nfc.controller=null;nfc.reader=null;nfc.phase='stopped';nfc.message='扫描已停止。';if(!silent&&page==='nfc')render();}
function getSceneFromNdef(message){
 for(const rec of message?.records||[]){
   if(!['url','text','absolute-url'].includes(rec.recordType))continue;
   let raw='';try{raw=new TextDecoder().decode(rec.data);}catch{continue;}
   try{
     const u=new URL(raw);
     if(!trustedDormSceneUrl(u))continue;
     const tagId=u.searchParams.get('dormTag');
     const encodedScene=u.searchParams.get('dormScene');
     const own=state.nfcTags.find(x=>x.id===tagId);
     if(own)return {scene:own.scene,label:own.name,tagId:own.id,encodedScene,stale:!!encodedScene&&encodedScene!==own.scene};
     if(sceneDefs.some(x=>x.id===encodedScene))return {scene:encodedScene,label:'未注册的场景链接',tagId:null,encodedScene,stale:false};
   }catch{continue;}
 }
 return null;
}
function trustedDormSceneUrl(u){
 const allowed=new Set([location.origin,'https://dorm-os-dk9.pages.dev','https://dorm.0701000.xyz']);
 return u.protocol==='https:'&&allowed.has(u.origin)&&(u.pathname===location.pathname||u.pathname==='/'||u.pathname==='/index.html');
}
async function startNfcScan(){const support=readerSupport({NDEFReader:globalThis.NDEFReader,isSecureContext:globalThis.isSecureContext,protocol:location.protocol});if(!support.ok){nfc.phase='error';nfc.message=support.reason;render();return;}if(nfc.controller)return;
 const id=++nfc.scanAttempt;const controller=new AbortController();nfc.controller=controller;nfc.phase='starting';nfc.message='正在请求 NFC 权限……';
 try{const reader=new NDEFReader();nfc.reader=reader;
 reader.addEventListener('readingerror',()=>{if(id!==nfc.scanAttempt)return;nfc.phase='scanning';nfc.message='检测到了标签，但浏览器无法读取 NDEF 内容。';if(page==='nfc')render();});

   if(value.tagId){
     const tag=state.nfcTags.find(x=>x.id===value.tagId);

   }
   if(value.stale){
     stopNfcScan({silent:true});
     nfc.phase='stale';
     nfc.message=`实体标签「${value.label}」仍保存旧场景，请重写后再试；网页改绑并没有自动改写 NFC 标签。`;
     log(`手机前台读取发现旧 NFC 场景：${value.label}`);
     persist();render();toast('发现旧 NFC 内容，请重写实体标签');return;
   }
   stopNfcScan({silent:true});
   nfc.phase='matched';
   nfc.message=`手机真实读取：${value.label}。网站场景已切换，未控制系统设置。`;
   activateScene(value.scene,'NFC 前台真实读取');setPage('scenes');toast('NFC 读取成功，网站场景已切换');
 });
 const pending=reader.scan({signal:controller.signal});render();await pending;if(id!==nfc.scanAttempt)return;nfc.phase='scanning';nfc.message='正在扫描，请将 NFC 标签靠近手机。';if(page==='nfc')render();}

function parseCSV(text){const rows=[];let row=[],s='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){s+='"';i++;}else if(ch==='"')q=false;else s+=ch;}else{if(ch==='"')q=true;else if(ch===','){row.push(s);s='';}else if(ch==='\n'){row.push(s.replace(/\r$/,''));rows.push(row);row=[];s='';}else s+=ch;}}if(q)throw new Error('CSV 引号没有闭合');if(s!==''||row.length){row.push(s);rows.push(row);}const heading=rows.shift()?.map(x=>x.replace(/^\uFEFF/,'').trim())||[];const expected=['day','subject','start','end','location'];if(expected.some((x,i)=>heading[i]!==x))throw new Error('表头必须为 day,subject,start,end,location');const classes=[];for(const r of rows){if(r.every(x=>!x.trim()))continue;const days={'周日':0,'周一':1,'周二':2,'周三':3,'周四':4,'周五':5,'周六':6};const day=r[0] in days?days[r[0]]:Number(r[0]);const record={id:newId(),day,start:r[2]?.trim(),end:r[3]?.trim(),subject:r[1]?.trim(),location:r[4]?.trim()||''};if(!Number.isInteger(day)||day<0||day>6||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(record.start)||!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(record.end)||record.start>=record.end||!record.subject)throw new Error(`第 ${rows.indexOf(r)+2} 行数据不符合课程格式`);classes.push(record);}if(classes.length>150)throw new Error('单次导入课程不能超过 150 条');return classes;}

const BACKUP_KDF_ITERATIONS=250000;
function bytesToBase64(bytes){let str='';for(let i=0;i<bytes.length;i+=16384)str+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(str);}
function base64ToBytes(value){if(typeof value!=='string'||value.length>3000000||!/^[A-Za-z0-9+/=]+$/.test(value))throw Error('无效加密内容');return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}

async function encryptBackup(data,password){

}
async function decryptBackup(backup,password){

 const salt=base64ToBytes(backup.salt),iv=base64ToBytes(backup.iv),ciphertext=base64ToBytes(backup.data);
 if(salt.length!==16||iv.length!==12||ciphertext.length<17||ciphertext.length>2000000)throw Error('加密数据无效');
 const key=await deriveBackupKey(password,salt,backup.iterations);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext);
 return safeState(JSON.parse(new TextDecoder().decode(plain)));
}

function clickAction(action){if(action==='add-task')taskDialog();else if(action==='add-class')classDialog();else if(action==='balance')balanceDialog();else if(action==='close-modal')$('editor').close();else if(action==='refresh-weather')fetchWeather(true);else if(action==='export-encrypted')encryptedExportDialog();else if(action==='export'){download(`dorm-os-backup-${now().date}.json`,exportedBackup());toast('已下载备份文件');}else if(action==='import')$('importInput').click();else if(action==='eink-export'){download(`dorm-os-eink-${now().date}.json`,JSON.stringify(eInkPayload(state,weather),null,2));toast('已导出墨水屏数据快照（非实时接口）');}else if(action==='csv-template'){download('dorm-os-course-template.csv','day,subject,start,end,location\n1,示例课程,08:00,09:40,示例教室\n','text/csv');toast('已下载 CSV 模板，请替换示例内容');}else if(action==='csv-import')csvImport();else if(action==='ics-import')icsImport();else if(action==='add-campus-link')campusLinkDialog();else if(action==='clear-calendar'){if(state.calendarEvents.length&&confirm('确定删除当前浏览器中全部导入的日历课程？')){state.calendarEvents=[];log('清空导入的日历课程');persist();render();toast('已清空导入课程');}}else if(action==='reset'){if(confirm('确定删除本浏览器所有 DORM OS 课程、任务和设置吗？此操作不能撤销。')){state=structuredClone(DEFAULT_STATE);persist();weather=null;loadWeather();setPage('dashboard');toast('已清空本地数据');}}else if(action==='tag-add')tagDialog();else if(action==='reminder-add')reminderDialog();else if(action==='item-add')itemDialog();else if(action==='pwa-install')installPwa();else if(action==='nfc-start')startNfcScan();else if(action==='nfc-stop')stopNfcScan();else if(action==='timer-toggle'){timer.running?timerStop():timerStart();render();}else if(action==='timer-reset'){timerStop();timer.remaining=25*60;render();}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action], [data-page], [data-scene], [data-task-edit], [data-task-delete], [data-class-edit], [data-class-delete], [data-campus-link-delete], [data-filter], [data-tag-edit], [data-tag-delete], [data-tag-write], [data-tag-copy], [data-tag-test], [data-reminder-edit], [data-reminder-delete], [data-item-edit], [data-item-delete]');if(!target)return;
  if(target.dataset.page){e.preventDefault();setPage(target.dataset.page);}else if(target.dataset.action)clickAction(target.dataset.action);else if(target.dataset.filter){taskFilter=target.dataset.filter;render();}else if(target.dataset.scene){activateScene(target.dataset.scene,'网页按钮');toast('网站场景已切换；外部设备未执行控制');}else if(target.dataset.tagEdit)tagDialog(target.dataset.tagEdit);else if(target.dataset.tagWrite)writeNfcTag(target.dataset.tagWrite);else if(target.dataset.tagCopy)copyTagLink(target.dataset.tagCopy);else if(target.dataset.tagTest)testTagLink(target.dataset.tagTest);else if(target.dataset.tagDelete){const t=state.nfcTags.find(x=>x.id===target.dataset.tagDelete);if(t&&confirm(`删除标签配置「${t.name}」？此操作不会擦除实体标签。`)){state.nfcTags=state.nfcTags.filter(x=>x.id!==t.id);persist();render();}}else if(target.dataset.reminderEdit)reminderDialog(target.dataset.reminderEdit);else if(target.dataset.itemEdit)itemDialog(target.dataset.itemEdit);else if(target.dataset.reminderDelete){state.reminders=state.reminders.filter(x=>x.id!==target.dataset.reminderDelete);persist();render();}else if(target.dataset.itemDelete){state.items=state.items.filter(x=>x.id!==target.dataset.itemDelete);persist();render();}else if(target.dataset.taskEdit)taskDialog(target.dataset.taskEdit);else if(target.dataset.classEdit)classDialog(target.dataset.classEdit);else if(target.dataset.taskDelete){const t=state.tasks.find(x=>x.id===target.dataset.taskDelete);if(t&&confirm(`删除任务「${t.title}」？`)){state.tasks=state.tasks.filter(x=>x.id!==t.id);log(`删除任务：${t.title}`);persist();render();}}else if(target.dataset.campusLinkDelete){const link=state.campusLinks.find(x=>x.id===target.dataset.campusLinkDelete);if(link&&confirm(`删除校园服务「${link.name}」？`)){state.campusLinks=state.campusLinks.filter(x=>x.id!==link.id);persist();render();toast('服务入口已删除');}}else if(target.dataset.classDelete){const c=state.classes.find(x=>x.id===target.dataset.classDelete);if(c&&confirm(`删除课程「${c.subject}」？`)){state.classes=state.classes.filter(x=>x.id!==c.id);log(`删除课程：${c.subject}`);persist();render();}}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-reminder-toggle]')){const r=state.reminders.find(x=>x.id===el.dataset.reminderToggle);if(r){r.done=el.checked;persist();render();}}else if(el.matches('[data-task-toggle]')){const t=state.tasks.find(x=>x.id===el.dataset.taskToggle);if(t){t.done=el.checked;log(`${t.done?'完成':'恢复'}任务：${t.title}`);persist();render();}}else if(el.id==='campusSelect'){state.settings.campus=el.value in CAMPUSES?el.value:'jianghuai';persist();weather=null;loadWeather();render();fetchWeather();}else if(el.id==='themeSelect'){state.settings.theme=el.value==='light'?'light':'dark';persist();render();}});
document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();processForm(e.target);}});
$('quickAdd').addEventListener('click',()=>taskDialog());
$('icsInput').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
   if(file.size>1024*1024)throw new Error('请使用小于 1MB 的 .ics 日历文件');
   const parsed=parseICalendar(await file.text());
   if(!parsed.events.length){toast(parsed.warnings[0]||'日历中没有可识别的课程');return;}
   const merged=mergeCalendar(state.calendarEvents,parsed.events);
   if(merged.items.length>1200)throw new Error('导入后超过 1200 条课程上限');
   const message=`识别 ${parsed.events.length} 条日期课程\n新增 ${merged.added} 条，重复 ${merged.duplicates} 条，跳过 ${parsed.skipped} 条。\n确定导入吗？`;
   if(!confirm(message))return;
   state.calendarEvents=merged.items;log(`导入教务 iCalendar：新增 ${merged.added} 条，跳过 ${parsed.skipped} 条`);persist();render();
   toast(`导入完成：新增 ${merged.added} 条${parsed.skipped?'，有部分无法识别':''}`);
   if(parsed.warnings.length)alert('未识别事件（最多显示 8 条）：\n'+parsed.warnings.join('\n'));
 }catch(err){toast(`日历导入失败：${err.message}`);}finally{e.target.value='';}
});
$('importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>3*1024*1024)throw new Error('备份超过 3MB');const obj=JSON.parse(await file.text());if(obj?.format===ENCRYPTED_BACKUP_MARKER){pendingEncryptedBackup=obj;encryptedImportDialog();return;}const parsed=safeState(obj);if(!confirm('恢复将覆盖当前浏览器中所有任务、课表和设置，确定继续吗？'))return;const previous=state;state=parsed;if(!persist()){state=previous;return;}weather=null;loadWeather();setPage('dashboard');toast('备份恢复成功');}catch(err){toast(`恢复失败：${err.message}`);}finally{e.target.value='';}});
$('editor').addEventListener('click',e=>{if(e.target===$('editor'))$('editor').close();});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(nameMap[h]&&h!==page){page=h;render();}});
function updateOfflineBanner(){$('offlineBanner').hidden=navigator.onLine;}
async function installPwa(){if(!deferredInstallPrompt){toast('如果浏览器未显示安装提示，请使用浏览器菜单中的「添加到主屏幕」');return;}const p=deferredInstallPrompt;deferredInstallPrompt=null;try{await p.prompt();await p.userChoice;}catch(e){console.warn('安装提示不可用',e);}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
window.addEventListener('online',()=>{updateOfflineBanner();fetchWeather();});
window.addEventListener('offline',updateOfflineBanner);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)timerSync();});
window.addEventListener('storage',event=>{if(event.key!==STORAGE||!event.newValue)return;try{state=safeState(JSON.parse(event.newValue));if($('editor').open)$('editor').close();render();toast('已同步此浏览器另一标签页的修改');}catch(err){console.warn('其他标签页数据无法解析',err);}});
const deepLink=new URLSearchParams(location.search);
const requestedTag=deepLink.get('dormTag');
const linkedTag=state.nfcTags.find(t=>t.id===requestedTag);
const encodedScene=deepLink.get('dormScene');
const linkedScene=linkedTag?.scene||encodedScene;
if((requestedTag||deepLink.has('dormScene'))&&linkedTag&&encodedScene&&encodedScene!==linkedTag.scene){
  nfc.phase='stale';nfc.message=`网页绑定「${linkedTag.name}」已经修改，但实体链接仍指向「${sceneLabel(encodedScene)}」，请重新写入 NFC 标签。`;
  log(`旧 NFC 场景链接：${linkedTag.name}，没有切换场景`);
  persist();history.replaceState(null,'',location.pathname+'#nfc');
}else if((requestedTag||deepLink.has('dormScene'))&&sceneDefs.some(s=>s.id===linkedScene)){
  state.scene=linkedScene;
  log(`网页场景链接打开「${sceneLabel(linkedScene)}」（不是 NFC 实体读取证明；外部设备未控制）`);
  persist();history.replaceState(null,'',location.pathname+'#scenes');
}
page=nameMap[location.hash.slice(1)]?location.hash.slice(1):'dashboard';
loadWeather();render();fetchWeather();setInterval(tick,10000);
updateOfflineBanner();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')) navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('离线缓存注册失败',e));

</script>
