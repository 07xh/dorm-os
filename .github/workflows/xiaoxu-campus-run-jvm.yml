name: Xiaoxu Android JVM Regression

# Reuse the existing JVM-only Android workflow for all native Kotlin edits.
# Compiles Compose and runs unit tests; does NOT assemble APKs or deploy.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/xiaoxu-android/app/src/**/*.kt'
      - 'apps/xiaoxu-android/app/build.gradle'
      - 'apps/xiaoxu-android/app/src/main/AndroidManifest.xml'
      - '.github/workflows/xiaoxu-campus-run-jvm.yml'
      - '.github/xiaoxu-apk-build-requests/pending/*.txt'
  workflow_dispatch:

# New commits supersede older PR jobs; published main builds never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  campus-run-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK (no device/emulator)
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android Kotlin and run existing JVM unit tests
        run: gradle -p apps/xiaoxu-android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload JVM test reports only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-android-jvm-unit-test-reports
          path: |
            apps/xiaoxu-android/app/build/reports/tests/
            apps/xiaoxu-android/app/build/test-results/
          retention-days: 7
