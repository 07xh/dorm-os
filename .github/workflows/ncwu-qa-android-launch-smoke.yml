name: Xiaoxu isolated QA Android cold-start smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/xiaoxu-android/app/src/main/**'
      - 'apps/xiaoxu-android/app/build.gradle'
      - 'apps/xiaoxu-android/app/src/test/**'
      - '.github/workflows/ncwu-qa-android-launch-smoke.yml'
      - 'scripts/xiaoxu-qa-cold-start.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaoxu-qa-launch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cold-start:
    name: Verify cold launch on Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [35, 37]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM (emulator only)
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Install app on clean emulator and check two fresh launches
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash scripts/xiaoxu-qa-cold-start.sh
