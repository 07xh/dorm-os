name: Xiaoxu isolated QA Android cold-start smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/xiaoxu-android/app/src/main/**'
      - 'apps/xiaoxu-android/app/build.gradle'
      - 'apps/xiaoxu-android/app/src/test/**'
      - '.github/workflows/ncwu-qa-android-launch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaoxu-qa-launch-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cold-start:
    name: Install QA APK and verify Android process survives startup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM (emulator only)
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Install app on clean emulator and check two fresh launches
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            gradle -p apps/xiaoxu-android :app:assembleDebug -PxiaoxuIsolatedQa=true --no-daemon
            APK=apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
            test -s "$APK"
            adb install -r "$APK"
            PKG=io.github.x07xh.xiaoxu.unifiedqa
            for pass in 1 2; do
              adb shell am force-stop "$PKG" || true
              adb logcat -c || true
              echo "Cold-start attempt $pass"
              adb shell am start -W -n "$PKG/io.github.x07xh.xiaoxu.MainActivity"
              sleep 8
              PID=$(adb shell pidof "$PKG" | tr -d '\r' || true)
              if [ -z "$PID" ]; then
                echo "::error::Isolated QA Android process exited after launch"
                adb logcat -d -b crash -v threadtime | tail -n 180 || true
                exit 1
              fi
              echo "Cold-start $pass survived (PID $PID)"
              CRASH=$(adb logcat -d -b crash -v brief | grep -E 'FATAL EXCEPTION|Process: io.github.x07xh.xiaoxu.unifiedqa' || true)
              if [ -n "$CRASH" ]; then
                echo "::error::Android crash buffer contains a fatal exception"
                adb logcat -d -b crash -v threadtime | tail -n 180 || true
                exit 1
              fi
            done
            echo "PASS: isolated QA app survived two cold launches on API 35 emulator"
