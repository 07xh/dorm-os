name: NextTodo production D1 audit (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dorm-os-nexttodo-readonly-audit
  cancel-in-progress: false
jobs:
  audit:
    if: ${{ github.repository == '07xh/dorm-os' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only D1 identity, schema, integrity and Time Travel audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/audit-nexttodo-d1-production.mjs
      - name: Declare non-mutation contract
        if: success()
        run: |
          echo 'Read-only audit completed: no SQL mutation, migration or Pages deployment was requested.' >> "$GITHUB_STEP_SUMMARY"
