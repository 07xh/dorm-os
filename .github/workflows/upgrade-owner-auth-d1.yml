name: Upgrade XIAOXU Owner Auth D1 M12 (forward-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-owner-auth-d1.yml'
      - 'migrations/0010_academic_owner_auth.sql'
      - 'scripts/upgrade-academic-owner-auth-production.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xiaoxu-owner-auth-d1-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.repository == '07xh/dorm-os' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline owner-auth SQLite tests first
        run: node scripts/xiaoxu-owner-auth-tests.mjs
      - name: Validate exact bound production D1 then apply 0010 only when missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/upgrade-academic-owner-auth-production.mjs
