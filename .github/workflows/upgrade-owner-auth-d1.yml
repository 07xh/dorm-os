name: Upgrade XIAOXU Owner Auth + School Session Vault D1 (forward-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-owner-auth-d1.yml'
      - 'migrations/0010_academic_owner_auth.sql'
      - 'migrations/0011_academic_provider_sessions.sql'
      - 'migrations/0012_academic_second_class_sessions.sql'
      - 'scripts/upgrade-academic-owner-auth-production.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xiaoxu-owner-auth-d1-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.repository == '07xh/dorm-os' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline owner-auth SQLite tests first
        run: node scripts/xiaoxu-owner-auth-tests.mjs && node scripts/xiaoxu-school-session-vault-upgrade-tests.mjs
      - name: Validate exact production D1 then idempotently apply 0010/0011/0012
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/upgrade-academic-owner-auth-production.mjs
