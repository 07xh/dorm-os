name: Verify Xiaoxu PR287 Real Message UI
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/xiaoxu-pr287-android.yml'
      - 'apps/xiaoxu-android/**'
      - 'scripts/xiaoxu-android-bootstrap-tests.mjs'
  push:
    branches: [fix/286-real-message-poster-layout]
    paths:
      - '.github/workflows/xiaoxu-pr287-android.yml'
permissions:
  contents: read
jobs:
  compile-android:
    if: github.event_name == 'push' || github.head_ref == 'fix/286-real-message-poster-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no fake production messages
        run: node scripts/xiaoxu-android-bootstrap-tests.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 compile SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK and run Android JVM unit tests
        run: gradle -p apps/xiaoxu-android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Verify APK integrity and checksum
        run: |
          set -euo pipefail
          out=apps/xiaoxu-android/app/build/outputs/apk/debug
          test -s "$out/app-debug.apk"
          unzip -t "$out/app-debug.apk" > /dev/null
          (cd "$out" && sha256sum app-debug.apk > app-debug.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-287-real-message-ui-debug
          path: |
            apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
            apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
