name: Publish signed Xiaoxu Android release
on:
  push:
    branches: [main]
    paths: ['.github/xiaoxu-release/promotions/*.json', '.github/xiaoxu-release/recoveries/*.json']
  pull_request:
    paths: ['scripts/promote-xiaoxu-android.py', 'scripts/test_xiaoxu_promotion.py', '.github/workflows/promote-xiaoxu-android.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: xiaoxu-signed-release-promotion
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_xiaoxu_promotion.py
  promote:
    if: github.event_name == 'push'
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'build-tools;36.0.0'
      - name: Verify exact build provenance and existing signature before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/promote-xiaoxu-android.py
      - name: Preserve public release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-promoted-release
          path: ${{ runner.temp }}/xiaoxu-promoted-release/
          if-no-files-found: ignore
          retention-days: 30
