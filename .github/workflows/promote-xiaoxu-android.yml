name: Publish signed Xiaoxu Android release
on:
  push:
    branches: [main]
    paths: ['.github/xiaoxu-release/promotions/*.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: xiaoxu-signed-release-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'build-tools;36.0.0'
      - name: Verify exact build provenance and existing signature before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/promote-xiaoxu-android.py
      - name: Preserve public release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-promoted-release
          path: ${{ runner.temp }}/xiaoxu-promoted-release/
          if-no-files-found: ignore
          retention-days: 30
