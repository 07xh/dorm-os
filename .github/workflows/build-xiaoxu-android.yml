name: Build Xiaoxu Android Alpha

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/xiaoxu-android/**'
      - 'scripts/xiaoxu-android-bootstrap-tests.mjs'
      - '.github/workflows/build-xiaoxu-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/xiaoxu-android/**'
      - 'scripts/xiaoxu-android-bootstrap-tests.mjs'
      - '.github/workflows/build-xiaoxu-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no fake data or extra Android credential collector
        run: node scripts/xiaoxu-android-bootstrap-tests.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android compile SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble installable debug APK (no release keystore)
        run: gradle -p apps/xiaoxu-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-android-alpha-debug
          path: apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
