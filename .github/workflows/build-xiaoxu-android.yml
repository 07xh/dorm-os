name: Build Xiaoxu Android

# Build only by explicit user request. A pending request on a PR first compiles
# the Android APK and JVM tests before merge; the same approved marker on main
# triggers the formal Release after merge. Private signing material is never published.
# Web/Cloudflare releases still follow independent main CI.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/xiaoxu-apk-build-requests/pending/*.txt'
      - '.github/north-ui-source-import-requests/pending/*.txt'
  push:
    branches: [main]
    paths:
      - '.github/xiaoxu-apk-build-requests/pending/*.txt'

# New commits supersede older PR jobs; published main builds never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  request-gate:
    # A fork must not turn a marker into an unreviewed cross-repo build request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.request.outputs.requested }}
      release_requested: ${{ steps.request.outputs.release_requested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require an added or modified explicit APK request
        id: request
        run: node scripts/xiaoxu-apk-build-request.mjs

  build-android:
    needs: request-gate
    if: needs.request-gate.outputs.requested == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no fake data or extra Android credential collector
        run: node scripts/xiaoxu-android-bootstrap-tests.mjs
      - name: Verify optional Ace 6 local visual evidence collector
        run: |
          node --check scripts/xiaoxu-ace6-visual-qa.mjs
          node scripts/xiaoxu-ace6-visual-qa.mjs --help > /dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android compile SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile APK and run existing Android JVM unit tests
        run: gradle -p apps/xiaoxu-android :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease --no-daemon
      # For PRs, the separate exact-source runtime workflow already runs the
      # complete 32-test suite, including Room v1-v4 upgrade and owner isolation.
      # Wait for its actual result instead of booting a second emulator.
      - name: Require same-head Android runtime and Room migration suite
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$PR_HEAD_SHA"
          for attempt in {1..120}; do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow xiaoxu-secondclass-webview.yml \
              --commit "$PR_HEAD_SHA" --event pull_request --limit 15 \
              --json databaseId,headSha,status,conclusion)
            status=$(jq -r --arg sha "$PR_HEAD_SHA" '[.[] | select(.headSha == $sha)] | first | .status // empty' <<< "$runs")
            conclusion=$(jq -r --arg sha "$PR_HEAD_SHA" '[.[] | select(.headSha == $sha)] | first | .conclusion // empty' <<< "$runs")
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                echo "Exact-source Android runtime suite passed: $PR_HEAD_SHA"
                exit 0
              fi
              echo "Exact-source Android runtime suite did not pass: $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo "No successful exact-source Android instrumentation result." >&2
          exit 1
      # Explicit main/release or manually dispatched builds still run their own
      # isolated migration test; the cross-workflow shortcut is PR-only.
      - name: Verify Room v1-v4 migration and dependency constraints on Android
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p apps/xiaoxu-android :app:connectedDebugAndroidTest -PxiaoxuRuntimeTest=true --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete application contracts
        run: npm install --no-audit --no-fund --ignore-scripts && npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-android-release-unsigned
          path: |
            apps/xiaoxu-android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/xiaoxu-android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
      - name: Compile navigation frame benchmark instrumentation
        run: gradle -p apps/xiaoxu-android :benchmark:assembleBenchmarkRelease :benchmark:assembleNonMinifiedRelease --no-daemon
      - name: Validate APK archive and produce verifiable SHA-256
        run: |
          set -euo pipefail
          out=apps/xiaoxu-android/app/build/outputs/apk/debug
          test -s "$out/app-debug.apk"
          unzip -t "$out/app-debug.apk" >/dev/null
          # Avoid grep -q closing an unzip pipe under set -o pipefail.
          unzip -Z1 "$out/app-debug.apk" > "$RUNNER_TEMP/xiaoxu-apk-entries.txt"
          grep -qx 'AndroidManifest.xml' "$RUNNER_TEMP/xiaoxu-apk-entries.txt"
          grep -Eq '^classes[0-9]*[.]dex$' "$RUNNER_TEMP/xiaoxu-apk-entries.txt"

          (cd "$out" && sha256sum app-debug.apk > app-debug.apk.sha256)
          cat "$out/app-debug.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-android-alpha-debug
          path: |
            apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
            apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      # The normal debug APK above remains unchanged. The second, opt-in QA
      # package uses distinct Android app identity and private app storage.
      - name: Compile isolated unified native UI QA APK for side-by-side testing
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          gradle -p apps/xiaoxu-android :app:assembleDebug -PxiaoxuIsolatedQa=true --no-daemon
          out=apps/xiaoxu-android/app/build/outputs/apk/debug
          test -s "$out/app-debug.apk"
          aapt_bin="$ANDROID_HOME/build-tools/36.0.0/aapt"
          actual_package=$("$aapt_bin" dump badging "$out/app-debug.apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$actual_package" = "io.github.x07xh.xiaoxu.unifiedqa"
          cp "$out/app-debug.apk" "$RUNNER_TEMP/xiaoxu-unified-native-qa.apk"
          (cd "$RUNNER_TEMP" && sha256sum xiaoxu-unified-native-qa.apk > xiaoxu-unified-native-qa.apk.sha256)
          unzip -t "$RUNNER_TEMP/xiaoxu-unified-native-qa.apk" >/dev/null
      - name: Upload separately installable unified native UI QA APK
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-unified-native-qa-isolated
          path: |
            ${{ runner.temp }}/xiaoxu-unified-native-qa.apk
            ${{ runner.temp }}/xiaoxu-unified-native-qa.apk.sha256
          if-no-files-found: error
          retention-days: 14


  publish-release:
    needs: [request-gate, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.request-gate.outputs.release_requested == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: xiaoxu-android-release-unsigned
          path: downloaded-release
      - name: Restore checked unsigned APK
        run: |
          mkdir -p apps/xiaoxu-android/app/build/outputs/apk/release
          cp "$(find downloaded-release -name app-release-unsigned.apk -print -quit)" apps/xiaoxu-android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Require complete main CI at this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --commit "$GITHUB_SHA" --event push --limit 10 --json databaseId,headSha,status,conclusion)
            count=$(jq 'length' <<< "$runs")
            if [[ "$count" -gt 0 ]]; then
              status=$(jq -r '.[0].status' <<< "$runs")
              if [[ "$status" == completed ]]; then
                [[ $(jq -r '.[0].conclusion' <<< "$runs") == success ]] || exit 1
                [[ $(jq -r '.[0].headSha' <<< "$runs") == "$GITHUB_SHA" ]]
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Exact-source main CI did not finish successfully.' >&2
          exit 1
      - name: Select stable signing route
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.XIAOXU_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$SIGNING_KEY" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Unsigned Release verified. Await an APK signed with the existing private key; never generate a replacement key.'
          fi
      - name: Sign, preserve encrypted recovery backup and publish formal release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          XIAOXU_KEYSTORE_BASE64: ${{ secrets.XIAOXU_KEYSTORE_BASE64 }}
          XIAOXU_STORE_PASSWORD: ${{ secrets.XIAOXU_STORE_PASSWORD }}
          XIAOXU_KEY_PASSWORD: ${{ secrets.XIAOXU_KEY_PASSWORD }}
          XIAOXU_KEY_ALIAS: ${{ secrets.XIAOXU_KEY_ALIAS }}
        run: bash scripts/xiaoxu-android-release.sh
      - name: Preserve signed release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-android-formal-release
          path: ${{ runner.temp }}/xiaoxu-release/
          if-no-files-found: ignore
          retention-days: 30

  import-north-ui-full-source:
    # This one-off request imports a complete, immutable upstream project snapshot.
    # It is deliberately separate from the normal 校序 APK build/release gate.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Fetch and verify the pinned complete upstream source
        env:
          UPSTREAM_COMMIT: bb3b80a6d64e4c2057c0544bb417696ceaa2a9ed
          UPSTREAM_TREE: 9284dad51679829d1182f05b57b33490b464e611
          EXPECTED_FILES: '1222'
          TARGET: apps/xiaoxu-android/upstream/zhengfang-apk-v1.0.135
          WORKING_COPY: apps/xiaoxu-android/migrated
          IMPORT_MARKER: .github/north-ui-source-import-requests/pending/v1.0.135-working-copy.txt
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/zhengfang-apk-v1.0.135"
          git clone --depth 1 --branch v1.0.135 https://github.com/znjhahaha/zhengfang-apk.git "$source_dir"

          actual_commit=$(git -C "$source_dir" rev-parse HEAD)
          actual_tree=$(git -C "$source_dir" rev-parse 'HEAD^{tree}')
          actual_files=$(git -C "$source_dir" ls-tree -r --name-only HEAD | wc -l | tr -d ' ')
          test "$actual_commit" = "$UPSTREAM_COMMIT"
          test "$actual_tree" = "$UPSTREAM_TREE"
          test "$actual_files" = "$EXPECTED_FILES"

          mkdir -p "$(dirname "$TARGET")"
          mkdir -p "$TARGET"
          # Reconcile the isolated vendor directory to the exact upstream tree.
          # --delete removes only stale files inside this dedicated mirror directory.
          rsync -a --delete --exclude=.git "$source_dir/" "$TARGET/"
          # The immutable vendor snapshot remains untouched; this is the full working fork.
          mkdir -p "$WORKING_COPY"
          rsync -a --delete --exclude=.git "$source_dir/" "$WORKING_COPY/"

          copied_files=$(find "$TARGET" -type f | wc -l | tr -d ' ')
          test "$copied_files" = "$EXPECTED_FILES"
          diff -qr --exclude=.git "$source_dir" "$TARGET"
          (cd "$source_dir" && find . -path ./.git -prune -o -type f -printf "%P %m\n" | sort) > "$RUNNER_TEMP/upstream-file-modes.txt"
          (cd "$TARGET" && find . -type f -printf "%P %m\n" | sort) > "$RUNNER_TEMP/copied-file-modes.txt"
          diff -u "$RUNNER_TEMP/upstream-file-modes.txt" "$RUNNER_TEMP/copied-file-modes.txt"
          working_files=$(find "$WORKING_COPY" -type f | wc -l | tr -d " ")
          test "$working_files" = "$EXPECTED_FILES"
          diff -qr --exclude=.git "$source_dir" "$WORKING_COPY"
          (cd "$WORKING_COPY" && find . -type f -printf "%P %m\\n" | sort) > "$RUNNER_TEMP/working-file-modes.txt"
          diff -u "$RUNNER_TEMP/upstream-file-modes.txt" "$RUNNER_TEMP/working-file-modes.txt"

          # Remove the one-shot request marker so it cannot become a standing build trigger.
          git rm -f --ignore-unmatch "$IMPORT_MARKER" || true
          git add -f -- "$TARGET" "$WORKING_COPY"
          index_tree=$(git write-tree)
          staged_files=$(git ls-tree -r "$index_tree" -- "$TARGET" | wc -l | tr -d " ")
          staged_tree=$(git rev-parse "$index_tree:$TARGET")
          working_staged_files=$(git ls-tree -r "$index_tree" -- "$WORKING_COPY" | wc -l | tr -d " ")
          working_staged_tree=$(git rev-parse "$index_tree:$WORKING_COPY")
          test "$staged_files" = "$EXPECTED_FILES"
          test "$staged_tree" = "$UPSTREAM_TREE"
          test "$working_staged_files" = "$EXPECTED_FILES"
          test "$working_staged_tree" = "$UPSTREAM_TREE"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "refactor(android): seed migration working copy from upstream v1.0.135"
            git push origin "HEAD:refs/heads/$PR_HEAD_REF"
          fi
          committed_tree=$(git rev-parse "HEAD:$TARGET")
          working_committed_tree=$(git rev-parse "HEAD:$WORKING_COPY")
          test "$committed_tree" = "$UPSTREAM_TREE"
          test "$working_committed_tree" = "$UPSTREAM_TREE"

          {
            echo "## Complete upstream source import"
            echo "- Immutable source tree SHA: `$committed_tree`"
            echo "- Working-copy tree SHA: `$working_committed_tree`"
            echo "- Repository: https://github.com/znjhahaha/zhengfang-apk"
            echo "- Tag: v1.0.135"
            echo "- Commit: `$actual_commit`"
            echo "- Tree: `$actual_tree`"
            echo "- Files verified: $copied_files / $EXPECTED_FILES"
            echo "- Destination: `$TARGET`"
            echo "- Source was copied without editing or pruning."
            echo "- Working copy: `$WORKING_COPY` (initially byte-for-byte identical; all future migration edits go here)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install the exact upstream compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile and test the pristine upstream-derived working project
        working-directory: apps/xiaoxu-android/migrated
        run: |
          set -euo pipefail
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-parallel --max-workers=2 --console=plain

