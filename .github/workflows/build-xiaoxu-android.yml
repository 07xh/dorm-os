name: Build Xiaoxu Android Alpha

# Build only by an explicit user request: GitHub manual dispatch or a
# reviewed request marker merged into main. No build on routine pushes.
# Web/Cloudflare releases still follow independent main CI.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/xiaoxu-apk-build-requests/**'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no fake data or extra Android credential collector
        run: node scripts/xiaoxu-android-bootstrap-tests.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android compile SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble installable debug APK (no release keystore)
        run: gradle -p apps/xiaoxu-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-android-alpha-debug
          path: apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

