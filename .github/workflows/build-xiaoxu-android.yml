name: Build Xiaoxu Android Alpha

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/xiaoxu-android/**'
      - 'scripts/xiaoxu-android-bootstrap-tests.mjs'
      - '.github/workflows/build-xiaoxu-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/xiaoxu-android/**'
      - 'scripts/xiaoxu-android-bootstrap-tests.mjs'
      - '.github/workflows/build-xiaoxu-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no fake data or extra Android credential collector
        run: node scripts/xiaoxu-android-bootstrap-tests.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android compile SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble installable debug APK (no release keystore)
        run: gradle -p apps/xiaoxu-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-android-alpha-debug
          path: apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  publish-v03-alpha:
    name: Publish direct APK link (one-time v0.3.0)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-xiaoxu-android-v0.3.0]')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xiaoxu-android-alpha-debug
          path: apk
      - name: Publish v0.3.0 alpha APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='xiaoxu-android-v0.3.0-alpha'
          APK='xiaoxu-android-v0.3.0-alpha-debug.apk'
          test -s apk/app-debug.apk
          cp apk/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title '校序 Android V0.3 Debug Alpha' \
            --prerelease \
            --notes 'Debug preview with local tasks, Cloudflare tasks, public notices and verified-timetable display. School login and Android 16 device checks remain pending. Back up local data before reinstalling.'
          echo "Direct APK URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"
