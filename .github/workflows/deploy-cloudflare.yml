name: Deploy DORM OS to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dorm-os-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser testing tools
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Check source and behavior
        run: npm run check && npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dorm-os-deploy-verify-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mark this immutable release with its exact commit
        run: |
          node -e "require('node:fs').writeFileSync('public/revision.json', JSON.stringify({commit:process.env.GITHUB_SHA, builtAt:new Date().toISOString()},null,2)+'\n')"
      - name: Publish verified static website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Cloudflare deployment secrets missing'; exit 1
          fi
          npx --yes wrangler@4 pages deploy public --project-name=dorm-os --branch=main 2>&1 | tee "$RUNNER_TEMP/dorm-pages-deploy.log"
      - name: Verify deployed HTML, PWA, and exact revision over HTTPS
        run: |
          site="$(grep -Eo 'https://[a-z0-9-]+\.dorm-os-dk9\.pages\.dev' "$RUNNER_TEMP/dorm-pages-deploy.log" | tail -n1)"
          if [ -z "$site" ]; then
            echo 'Missing deployment-specific Pages URL'; exit 1
          fi
          node scripts/verify-release.mjs "$site"
          echo "Verified production release: $site" >> "$GITHUB_STEP_SUMMARY"
