name: Deploy DORM OS to Cloudflare Pages
on:
  # Pages releases only after the same-repository push to main passes CI.
  workflow_run:
    workflows: ["DORM OS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
concurrency:
  group: dorm-os-pages
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser testing tools
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install Chromium test runtime
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Check source and behavior
        run: |
          npm run check
          # Trusted CI already ran the desktop/mobile E2E on this exact SHA.
          # A manual release still runs E2E itself before publishing.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            npm run test:e2e
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dorm-os-deploy-verify-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pages Functions runtime dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Mark this immutable release with its exact commit
        run: |
          node -e "require('node:fs').writeFileSync('public/revision.json', JSON.stringify({commit:process.env.RELEASE_SHA, builtAt:new Date().toISOString()},null,2)+'\n')"
      - name: Ensure second-class session key exists without rotating it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-school-session-key.mjs
      - name: Publish verified static website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Cloudflare deployment secrets missing'; exit 1
          fi
          npx --yes wrangler@4 pages deploy public --project-name=dorm-os --branch=main 2>&1 | tee "$RUNNER_TEMP/dorm-pages-deploy.log"
      - name: Verify deployed HTML, PWA, and exact revision over HTTPS
        run: |
          site="$(grep -Eo 'https://[a-z0-9-]+\.dorm-os-dk9\.pages\.dev' "$RUNNER_TEMP/dorm-pages-deploy.log" | tail -n1)"
          if [ -z "$site" ]; then
            echo 'Missing deployment-specific Pages URL'; exit 1
          fi
          node scripts/verify-release.mjs "$site"
          echo "Verified production release: $site" >> "$GITHUB_STEP_SUMMARY"
      - name: Read-only audit of Academic OS D1 and Access binding names
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-cloudflare-academic-production.mjs
      - name: Read-only verification of exact production D1 schema and integrity
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/audit-academic-d1-production.mjs
