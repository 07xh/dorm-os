name: Verify Xiaoxu Issue 286 Android Real UI
on:
  push:
    branches:
      - feat/284-poster-ui
    paths:
      - '.github/workflows/xiaoxu-286-android-verify.yml'
      - 'apps/xiaoxu-android/**'
      - 'scripts/xiaoxu-android-bootstrap-tests.mjs'
permissions:
  contents: read
jobs:
  compile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce real-data UI safety checks
        run: node scripts/xiaoxu-android-bootstrap-tests.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 compile SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile real Android APK and run JVM unit tests
        run: gradle -p apps/xiaoxu-android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Verify APK and SHA-256
        run: |
          set -euo pipefail
          out=apps/xiaoxu-android/app/build/outputs/apk/debug
          test -s "$out/app-debug.apk"
          unzip -t "$out/app-debug.apk" >/dev/null
          (cd "$out" && sha256sum app-debug.apk > app-debug.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-286-real-ui-debug
          path: |
            apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
            apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
