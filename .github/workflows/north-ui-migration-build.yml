name: North UI Migration Build

on:
  pull_request:
    paths:
      - 'apps/xiaoxu-android/migrated/**'
      - '.github/workflows/north-ui-migration-build.yml'
  push:
    branches:
      - refactor/north-ui-full-source-v1.0.135
    paths:
      - 'apps/xiaoxu-android/migrated/**'
      - '.github/workflows/north-ui-migration-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: north-ui-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile original pages with 校序 data adapter
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install upstream SDK and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Compile, run unit tests, and assemble migration debug APK
        working-directory: apps/xiaoxu-android/migrated
        run: |
          set -euo pipefail
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-parallel --max-workers=2 --console=plain
