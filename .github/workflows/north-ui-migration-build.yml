name: North UI Migration Build

on:
  pull_request:
    paths:
      - 'apps/xiaoxu-android/migrated/**'
      - '.github/workflows/north-ui-migration-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: north-ui-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile original pages with 校序 data adapter
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install upstream SDK and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Compile and run unit tests
        id: unit-tests
        working-directory: apps/xiaoxu-android/migrated
        run: |
          set -euo pipefail
          bash ./gradlew :app:testDebugUnitTest --no-daemon --no-parallel --no-configuration-cache --max-workers=2 --console=plain

      - name: Assemble migration debug APK
        id: assemble
        if: ${{ always() && !cancelled() }}
        working-directory: apps/xiaoxu-android/migrated
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleDebug --no-daemon --no-parallel --no-configuration-cache --max-workers=2 --console=plain

      - name: Upload migration debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-north-ui-debug-${{ github.sha }}
          path: apps/xiaoxu-android/migrated/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-north-ui-test-report-${{ github.sha }}
          path: |
            apps/xiaoxu-android/migrated/app/build/reports/tests/testDebugUnitTest/
            apps/xiaoxu-android/migrated/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Emulator launch and frame-stats smoke test
        id: emulator-smoke
        if: ${{ always() && steps.assemble.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r apps/xiaoxu-android/migrated/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop io.github.x07xh.xiaoxu
            adb shell am start -W -n io.github.x07xh.xiaoxu/com.tyust.course.MainActivity
            sleep 12
            mkdir -p /tmp/xiaoxu-smoke
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/xiaoxu-smoke/window.xml
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png /tmp/xiaoxu-smoke/screen.png
            adb shell dumpsys gfxinfo io.github.x07xh.xiaoxu framestats > /tmp/xiaoxu-smoke/frame-stats.txt
            adb shell dumpsys activity activities > /tmp/xiaoxu-smoke/activities.txt
            cat /tmp/xiaoxu-smoke/activities.txt | tail -n 80

      - name: Upload emulator smoke evidence
        if: ${{ always() && steps.emulator-smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-north-ui-emulator-evidence-${{ github.sha }}
          path: /tmp/xiaoxu-smoke/
          if-no-files-found: ignore
          retention-days: 14
