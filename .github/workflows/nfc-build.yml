name: NFC KSU and Receiver APK
on:
  push:
    paths:
      - 'integrations/nfc-ksu/**'
      - '.github/workflows/nfc-build.yml'
  pull_request:
    paths:
      - 'integrations/nfc-ksu/**'
      - '.github/workflows/nfc-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test NFC module
        run: sh integrations/nfc-ksu/tests/test.sh
      - name: Build NFC receiver APK
        working-directory: integrations/nfc-ksu/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Package KernelSU ZIP
        run: |
          mkdir -p out
          cd integrations/nfc-ksu/module
          zip -qr "$GITHUB_WORKSPACE/out/DORM-OS-NFC-KSU-v0.1.0.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-ksu-apk
          path: |
            integrations/nfc-ksu/android/app/build/outputs/apk/debug/app-debug.apk
            out/DORM-OS-NFC-KSU-v0.1.0.zip
