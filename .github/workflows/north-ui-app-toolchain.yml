name: North UI app toolchain compatibility
on:
  push:
    branches: [refactor/north-ui-native-baseline-20261126]
    paths:
      - 'apps/xiaoxu-android/vendor/north-ui-v1.0.83/**'
      - '.github/workflows/north-ui-app-toolchain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile original UI using existing Xiaoxu compiler and SDK
        run: |
          cd apps/xiaoxu-android/vendor/north-ui-v1.0.83/validation
          cp build-app-toolchain.gradle build.gradle
          gradle compileDebugKotlin --no-daemon
