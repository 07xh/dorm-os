name: Publish Xiaoxu 0.7.7 direct APK on isolated binary branch

on:
  push:
    branches:
      - ci/build-xiaoxu-v0.7.7-20261105

permissions:
  contents: write
  actions: read

jobs:
  publish-raw-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      APK_SHA256: 2b7b0b087efe34d4c3db71be0bd373668debd3d5572bd61cf89f57b9750e1a32
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify successful Android build
        run: |
          mkdir -p "$RUNNER_TEMP/apk-verified"
          gh run download 41959739351 --repo "$GITHUB_REPOSITORY" --name xiaoxu-android-v0.7.7-debug --dir "$RUNNER_TEMP/apk-verified"
          echo "$APK_SHA256  $RUNNER_TEMP/apk-verified/app-debug.apk" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/apk-verified/app-debug.apk"
      - name: Publish APK on separate binary-only branch (not main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan apk-v0.7.7-20261105
          mkdir -p download
          cp "$RUNNER_TEMP/apk-verified/app-debug.apk" download/xiaoxu-android-v0.7.7-debug.apk
          git add -f download/xiaoxu-android-v0.7.7-debug.apk
          git commit -m "artifact: verified Xiaoxu Android v0.7.7 debug APK"
          git push origin HEAD:refs/heads/apk-v0.7.7-20261105
      - name: Verify public direct APK URL
        run: |
          curl -fL --retry 5 --retry-delay 2 -r 0-15 \
            "https://raw.githubusercontent.com/07xh/dorm-os/apk-v0.7.7-20261105/download/xiaoxu-android-v0.7.7-debug.apk" \
            -o "$RUNNER_TEMP/download-probe"
          test -s "$RUNNER_TEMP/download-probe"
