name: Build Xiaoxu Android v0.7.7 (one-off)

# Isolated debug build for the owner. Does not change main workflow triggers.
on:
  push:
    branches:
      - ci/build-xiaoxu-v0.7.7-20261105

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify source version 0.7.7
        shell: bash
        run: |
          grep -F "versionName '0.7.7'" apps/xiaoxu-android/app/build.gradle
          node scripts/xiaoxu-android-bootstrap-tests.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android compile SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        run: gradle -p apps/xiaoxu-android :app:assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-android-v0.7.7-debug
          path: apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
