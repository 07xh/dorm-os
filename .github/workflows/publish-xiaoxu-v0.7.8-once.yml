name: Publish Xiaoxu 0.7.8 test APK via direct download

on:
  push:
    branches:
      - ci/xiaoxu-native-first-0.7.8-verify-20261105

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified APK from successful build
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          gh run download 41962280193 --repo "$GITHUB_REPOSITORY" --name xiaoxu-android-v0.7.8-native-first-debug --dir "$RUNNER_TEMP/verified"
          test -s "$RUNNER_TEMP/verified/app-debug.apk"
          unzip -tq "$RUNNER_TEMP/verified/app-debug.apk"
      - name: Push test APK to binary-only GitHub branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan apk-v0.7.8-20261105
          mkdir -p download
          cp "$RUNNER_TEMP/verified/app-debug.apk" download/xiaoxu-android-v0.7.8-native-first-debug.apk
          ( cd download && sha256sum xiaoxu-android-v0.7.8-native-first-debug.apk > SHA256SUMS.txt )
          git add -f download/xiaoxu-android-v0.7.8-native-first-debug.apk download/SHA256SUMS.txt
          git commit -m "artifact: verified Xiaoxu Android 0.7.8 native-first debug APK"
          git push origin HEAD:refs/heads/apk-v0.7.8-20261105
      - name: Confirm public raw download
        run: |
          curl -fL --retry 4 --retry-delay 3 -r 0-15 \
            "https://raw.githubusercontent.com/07xh/dorm-os/apk-v0.7.8-20261105/download/xiaoxu-android-v0.7.8-native-first-debug.apk" \
            -o "$RUNNER_TEMP/apk-probe"
          test -s "$RUNNER_TEMP/apk-probe"
