name: Collect NCWU official notices
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ncwu-notices.mjs'
      - 'scripts/ncwu-upstream-notices.py'
      - 'public/xiaoxu-notices.js'
      - 'config/ncwu-notices.json'
      - '.github/workflows/collect-ncwu-notices.yml'
  workflow_dispatch:
  schedule:
    # 北京时间 10:17、18:17、次日 00:17；低频采集公开栏目
    - cron: '17 2,10,16 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: ncwu-notice-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out pinned NCWU public-source parser (optional)
        uses: actions/checkout@v4
        with:
          repository: awecsfgvs/ncwu-crawler
          ref: 31c505b74bcf40c47aa720c2e282afe081a3609b
          path: _third_party/ncwu-crawler
          persist-credentials: false
        continue-on-error: true
      - name: Install public HTML parsing dependency
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify offline parser and safety checks
        run: npm run notices:test
      - name: Collect optional department notices from pinned upstream
        continue-on-error: true
        run: |
          if [ -f _third_party/ncwu-crawler/ncwu_crawler/__init__.py ]; then
            python3 scripts/ncwu-upstream-notices.py "$RUNNER_TEMP/ncwu-upstream.json"
          else
            echo 'Pinned upstream unavailable; retaining built-in collector'
          fi
      - name: Collect real official notice pages and merge archival JSON
        env:
          NCWU_UPSTREAM_SNAPSHOT: ${{ runner.temp }}/ncwu-upstream.json
        run: npm run notices:collect
      - name: Verify verified live data file
        run: |
          node -e "const x=require('./public/data/notices.json'); if(x.mode!=='auto'||!x.lastSuccessAt||x.items.length<2||!x.sources.some(s=>s.status==='ok'))process.exit(1);console.log('Live data accepted:',x.items.length)"
      - name: Commit only verified public notice archive
        id: archive
        run: |
          if git diff --quiet -- public/data/notices.json; then
            echo 'No changes to publish'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/notices.json
          git commit -m "data(校序): refresh verified NCWU public notifications"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger `on: push` workflows. Without this
      # dispatch, the bot-written notice archive would never reach Pages.
      # deploy-cloudflare.yml runs full E2E checks for workflow_dispatch.
      - name: Deploy new public data via explicit workflow dispatch
        if: steps.archive.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main
