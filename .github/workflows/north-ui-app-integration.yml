name: North UI app integration compile
on:
  push:
    branches: [refactor/north-ui-native-baseline-20261126]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile actual app and test business state
        run: gradle -p apps/xiaoxu-android :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon
      - name: Compile optimized Release locally (no APK upload or publication)
        run: |
          gradle -p apps/xiaoxu-android :app:assembleRelease --no-daemon
          test -s apps/xiaoxu-android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum apps/xiaoxu-android/app/build/outputs/apk/release/app-release-unsigned.apk
