name: DORM OS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# New commits supersede older PR jobs; published main builds never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  wechat-windows-scheduler:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate QA crash diagnosis script syntax and read-only guard
        shell: powershell
        run: |
          $path = '.\scripts\xiaoxu-qa-crash-diagnostics.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host ("Line " + $_.Extent.StartLineNumber + ": " + $_.Message) }
            throw 'QA crash diagnosis PowerShell syntax invalid'
          }
          $source = ((Get-Content $path) | Where-Object { $_ -notmatch '^\s*#' }) -join "`n"
          foreach ($forbidden in @('adb uninstall', 'adb logcat -c', 'adb shell pm clear', 'adb shell reboot', 'Invoke-WebRequest')) {
            if ($source.Contains($forbidden)) { throw ("QA crash diagnosis includes unsafe command: " + $forbidden) }
          }
      - name: Validate optional Windows schedule script without registering tasks
        shell: powershell
        run: |
          foreach ($script in @(".\integrations\wechat\schedule.ps1", ".\integrations\wechat\run.ps1", ".\integrations\wechat\scheduled-run.ps1", ".\integrations\wechat\scheduled-digest.ps1", ".\integrations\wechat\digest-schedule.ps1")) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Host ("Syntax: " + $script + " line " + $_.Extent.StartLineNumber + " " + $_.Message) }
              throw "PowerShell WeChat bridge script syntax invalid"
            }
          }
          $runner = Get-Content ".\integrations\wechat\run.ps1" -Raw
          if ($runner -notmatch "py312-venv" -or $runner -notmatch '\$env:PYTHONPATH=\$toolDir') {
            throw "WeChat runner must select isolated Python 3.12 and tool-only module path"
          }
          if ($runner -match '\$env:PYTHONPATH=.*deps') {
            throw "WeChat runner must not mix bundled deps in PYTHONPATH"
          }
          Import-Module ScheduledTasks -ErrorAction Stop
          $trigger = New-ScheduledTaskTrigger -Daily -At "00:00"
          $repeat = New-CimInstance -ClientOnly -Namespace "root/Microsoft/Windows/TaskScheduler" -ClassName "MSFT_TaskRepetitionPattern" -Property @{Interval="PT15M";Duration="P1D";StopAtDurationEnd=$false}
          $trigger.Repetition = $repeat
          if ($trigger.Repetition.Interval -ne "PT15M" -or $trigger.Repetition.Duration -ne "P1D") { throw "Repetition pattern mismatch" }
          # Fixed UTC test instants; no live chat, secret or scheduled-task writes.
          $cases=@(
            @("2026-11-08T22:59:00Z", "SKIP"), # Beijing 06:59
            @("2026-11-08T23:00:00Z", "RUN"),  # Beijing 07:00
            @("2026-11-09T14:59:00Z", "RUN"),  # Beijing 22:59
            @("2026-11-09T15:00:00Z", "RUN"),  # Beijing 23:00
            @("2026-11-09T15:01:00Z", "SKIP")  # Beijing 23:01
          )
          foreach($test in $cases) {
            $got=& .\integrations\wechat\scheduled-run.ps1 check-time -AtUtc $test[0]
            if ($got -ne $test[1]) { throw "Beijing gate mismatch: expected $($test[1]) at $($test[0]), got $got" }
          }
          $scheduler=Get-Content ".\integrations\wechat\schedule.ps1" -Raw
          if ($scheduler -notmatch 'scheduled-run.ps1' -or
              $scheduler -notmatch 'PT15M' -or
              $scheduler -notmatch 'Interactive' -or
              $scheduler -notmatch 'legacyArgsLine') {
            throw "Scheduler must reuse collector with Beijing gate and support safe legacy upgrade"
          }
          # Verify 23:10 Beijing digest boundary without reading chat or installing tasks.
          $digestCases=@(
            @("2026-11-09T15:09:00Z", "SKIP"),
            @("2026-11-09T15:10:00Z", "RUN"),
            @("2026-11-09T15:59:00Z", "RUN"),
            @("2026-11-09T16:00:00Z", "SKIP")
          )
          foreach($test in $digestCases) {
            $got=& .\integrations\wechat\scheduled-digest.ps1 check-time -AtUtc $test[0]
            if ($got -ne $test[1]) { throw "Digest UTC+8 gate mismatch at $($test[0]): $got" }
          }
          $digestSchedule=Get-Content ".\integrations\wechat\digest-schedule.ps1" -Raw
          if ($digestSchedule -notmatch 'scheduled-digest.ps1' -or
              $digestSchedule -notmatch 'PT5M' -or
              $digestSchedule -notmatch 'Interactive') {
            throw "Digest scheduler must be opt-in, 5-minute gate, logged-on user only"
          }
          & .\integrations\wechat\digest-schedule.ps1 status
          & .\integrations\wechat\schedule.ps1 status
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser testing tools
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Syntax, security and logic tests
        run: npm run check
      - name: Android static safety checks (no SDK or APK compilation)
        run: node scripts/xiaoxu-android-bootstrap-tests.mjs
      - name: Second-class local score reader contract and failure paths
        run: node --test scripts/xiaoxu-secondclass-local-reader-tests.mjs scripts/xiaoxu-secondclass-local-activities-tests.mjs
      - name: Windows WeChat collector logic tests (synthetic only)
        run: python3 -m unittest discover -s integrations/wechat -p 'test_*.py'
      - name: Desktop and mobile end-to-end tests
        run: npm run test:e2e
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dorm-os-e2e-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
