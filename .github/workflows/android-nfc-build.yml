name: DORM OS NFC · Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-nfc-assistant/**'
      - '.github/workflows/android-nfc-build.yml'
  pull_request:
    paths:
      - 'android-nfc-assistant/**'
      - '.github/workflows/android-nfc-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 from hosted runner
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify native safety and UI invariants
        run: python3 -m unittest discover -s android-nfc-assistant/tests -v
      - name: Build native debug APK
        working-directory: android-nfc-assistant
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DORM-OS-NFC-V2-debug-APK
          path: android-nfc-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
