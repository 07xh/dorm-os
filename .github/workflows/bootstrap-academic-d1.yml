name: Bootstrap XIAOXU Academic D1 (new empty database only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-academic-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaoxu-one-time-production-d1
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == '07xh/dorm-os' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline schema preflight 0001–0009 (no Cloudflare access)
        run: node scripts/xiaoxu-db-preflight.mjs
      - name: Initialize exact bound production D1 only if empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/bootstrap-academic-d1-production.mjs
