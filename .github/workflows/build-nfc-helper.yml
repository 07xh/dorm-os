name: Build TapFlow Android app and KernelSU module

on:
  workflow_dispatch:
  # Build the exact APK for this preview branch even if draft-PR events are delayed.
  push:
    branches:
      - feature/ncwu-nfc-one-shot-v1
    paths:
      - 'android/nfc-helper/**'
      - 'modules/dormos-nfc-ksu/**'
      - '.github/workflows/build-nfc-helper.yml'
  pull_request:
    paths:
      - 'android/nfc-helper/**'
      - 'modules/dormos-nfc-ksu/**'
      - '.github/workflows/build-nfc-helper.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test TapFlow and build APKs
        working-directory: android/nfc-helper
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-test-report
          path: |
            android/nfc-helper/app/build/reports/tests/
            android/nfc-helper/app/build/test-results/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-receiver-debug
          path: android/nfc-helper/app/build/outputs/apk/debug/app-debug.apk

  signed-release-apk:
    if: github.event_name == 'workflow_dispatch' && vars.DORMOS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Materialize protected release keystore
        shell: bash
        env:
          DORMOS_RELEASE_KEYSTORE_BASE64: ${{ secrets.DORMOS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DORMOS_RELEASE_KEYSTORE_BASE64" || { echo "Missing DORMOS_RELEASE_KEYSTORE_BASE64"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/dormos-release.jks"
          umask 077
          printf '%s' "$DORMOS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "DORMOS_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build and verify stable-signed release APK
        working-directory: android/nfc-helper
        env:
          DORMOS_RELEASE_STORE_PASSWORD: ${{ secrets.DORMOS_RELEASE_STORE_PASSWORD }}
          DORMOS_RELEASE_KEY_ALIAS: ${{ secrets.DORMOS_RELEASE_KEY_ALIAS }}
          DORMOS_RELEASE_KEY_PASSWORD: ${{ secrets.DORMOS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DORMOS_RELEASE_STORE_PASSWORD"
          test -n "$DORMOS_RELEASE_KEY_ALIAS"
          test -n "$DORMOS_RELEASE_KEY_PASSWORD"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-receiver-release-signed
          path: android/nfc-helper/app/build/outputs/apk/release/app-release.apk

  ksu-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate event-driven module and dispatcher
        shell: bash
        run: |
          set -euo pipefail
          cd modules/dormos-nfc-ksu
          grep -qx 'id=dormos_nfc_actions' module.prop
          grep -qx 'version=1.22.1' module.prop
          grep -qx 'versionCode=23' module.prop
          test -s README.md
          test -f skip_mount
          test ! -e service.sh
          test ! -e post-fs-data.sh
          test ! -e post-mount.sh
          test ! -e boot-completed.sh
          test ! -e sepolicy.rule
          test ! -e webroot
          for script in action.sh run.sh dispatcher.sh script-manager.sh folder-manager.sh; do sh -n "$script"; done
          bash tests/test-dispatcher.sh
          bash tests/test-personal-scripts.sh
          bash tests/test-folders.sh
          test -z "$(find . -name '*.so' -o -name '*.dex')"
      - name: Package optional KernelSU module
        shell: bash
        run: |
          set -euo pipefail
          cd modules/dormos-nfc-ksu
          chmod 0755 run.sh dispatcher.sh script-manager.sh folder-manager.sh action.sh
          zip -q -r "$GITHUB_WORKSPACE/dormos-nfc-ksu.zip" module.prop skip_mount run.sh dispatcher.sh script-manager.sh folder-manager.sh action.sh README.md
          unzip -l "$GITHUB_WORKSPACE/dormos-nfc-ksu.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-ksu-module
          path: dormos-nfc-ksu.zip

  # Public preview download, explicitly enabled by a release-preview commit.
  # Publishes the exact APK from this run only after APK tests/build and KSU checks pass.
  publish-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ncwu-nfc-one-shot-v1' && startsWith(github.event.head_commit.message, 'release-preview:') }}
    needs: [debug-apk, ksu-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: dorm-os-nfc-receiver-debug
          path: preview/apk
      - name: Publish TapFlow V1.22.1 preview APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s preview/apk/app-debug.apk
          mkdir -p public
          cp preview/apk/app-debug.apk public/TapFlow-V1.22.1-navigation-fix-debug.apk
          (cd public && sha256sum TapFlow-V1.22.1-navigation-fix-debug.apk > SHA256SUMS.txt)
          TAG="tapflow-v1.22.1-navigation-fix-preview"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Refusing to overwrite the previously published preview: $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            public/TapFlow-V1.22.1-navigation-fix-debug.apk \
            public/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
            --title "触序 · TapFlow V1.22.1 · 导航按压反馈修复与自然转场" \
            --notes "TapFlow V1.22.1 navigation-fix preview. Built from commit $GITHUB_SHA after Android unit tests, APK build, and KernelSU checks pass. Removes the oversized rectangular tab press effect and extra Material3 NavigationBar nesting. Uses a compact 64dp fixed bottom bar, one 185ms selected capsule, and smaller 210ms directional page transitions. Preserves tap-only three-tab navigation, scroll position, NFC ReaderMode/write-back, and independent KernelSU installation. This is a DEBUG-signed preview APK, not a stable signed release; real-device frame pacing still needs validation."

  # Publish the independently installable KernelSU ZIP after its module-only
  # regression suite passes. The Android app remains a separate APK install.
  publish-ksu-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ncwu-nfc-one-shot-v1' && startsWith(github.event.head_commit.message, 'release-ksu-preview:') }}
    needs: [ksu-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified KernelSU ZIP
        uses: actions/download-artifact@v4
        with:
          name: dorm-os-nfc-ksu-module
          path: preview/ksu
      - name: Publish TapFlow KernelSU V1.22.1 module
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s preview/ksu/dormos-nfc-ksu.zip
          mkdir -p public
          cp preview/ksu/dormos-nfc-ksu.zip public/TapFlow-KernelSU-V1.22.1.zip
          (cd public && sha256sum TapFlow-KernelSU-V1.22.1.zip > TapFlow-KernelSU-V1.22.1.zip.sha256)
          TAG="tapflow-ksu-v1.22.1-audit-preview"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing module release: $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            public/TapFlow-KernelSU-V1.22.1.zip \
            public/TapFlow-KernelSU-V1.22.1.zip.sha256 \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
            --title "触序 · TapFlow KernelSU V1.22.1 · 模块审计版" \
            --notes "KernelSU-only module for TapFlow V1.22.1. Built after shell syntax, metadata, dispatcher, personal-script, folder, shared-lock, NFC enable/disable race, and fallback-lock checks passed. No service.sh, boot receiver, daemon, polling loop, WebUI, or bundled APK. Personal data remains in /data/adb/dormos_nfc_bridge across module updates and is intentionally not deleted on uninstall. Target-device KernelSU/Android 16 validation is still required."
