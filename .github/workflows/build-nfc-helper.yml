name: Build DORM OS NFC helper debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/nfc-helper/**'
      - '.github/workflows/build-nfc-helper.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test safety rules and build debug APK
        working-directory: android/nfc-helper
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dorm-os-ncwu-test-failures
          path: android/nfc-helper/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-ncwu-nfc-debug
          path: android/nfc-helper/app/build/outputs/apk/debug/app-debug.apk
