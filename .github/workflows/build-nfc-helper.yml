name: Build TapFlow Android app and KernelSU module

on:
  workflow_dispatch:
  # Build the exact APK for this preview branch even if draft-PR events are delayed.
  push:
    branches:
      - feature/ncwu-nfc-one-shot-v1
    paths:
      - 'android/nfc-helper/**'
      - 'modules/dormos-nfc-ksu/**'
      - '.github/workflows/build-nfc-helper.yml'
  pull_request:
    paths:
      - 'android/nfc-helper/**'
      - 'modules/dormos-nfc-ksu/**'
      - '.github/workflows/build-nfc-helper.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test TapFlow and build APKs
        working-directory: android/nfc-helper
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-test-report
          path: |
            android/nfc-helper/app/build/reports/tests/
            android/nfc-helper/app/build/test-results/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-receiver-debug
          path: android/nfc-helper/app/build/outputs/apk/debug/app-debug.apk

  signed-release-apk:
    if: github.event_name == 'workflow_dispatch' && vars.DORMOS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || test "${PIPESTATUS[1]}" -eq 0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Materialize protected release keystore
        shell: bash
        env:
          DORMOS_RELEASE_KEYSTORE_BASE64: ${{ secrets.DORMOS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DORMOS_RELEASE_KEYSTORE_BASE64" || { echo "Missing DORMOS_RELEASE_KEYSTORE_BASE64"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/dormos-release.jks"
          umask 077
          printf '%s' "$DORMOS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "DORMOS_RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build and verify stable-signed release APK
        working-directory: android/nfc-helper
        env:
          DORMOS_RELEASE_STORE_PASSWORD: ${{ secrets.DORMOS_RELEASE_STORE_PASSWORD }}
          DORMOS_RELEASE_KEY_ALIAS: ${{ secrets.DORMOS_RELEASE_KEY_ALIAS }}
          DORMOS_RELEASE_KEY_PASSWORD: ${{ secrets.DORMOS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DORMOS_RELEASE_STORE_PASSWORD"
          test -n "$DORMOS_RELEASE_KEY_ALIAS"
          test -n "$DORMOS_RELEASE_KEY_PASSWORD"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-receiver-release-signed
          path: android/nfc-helper/app/build/outputs/apk/release/app-release.apk

  ksu-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate event-driven module and dispatcher
        shell: bash
        run: |
          set -euo pipefail
          cd modules/dormos-nfc-ksu
          grep -qx 'id=dormos_nfc_actions' module.prop
          test -f skip_mount
          test ! -e service.sh
          test ! -e post-fs-data.sh
          test ! -e post-mount.sh
          test ! -e boot-completed.sh
          test ! -e sepolicy.rule
          test ! -e webroot
          for script in action.sh run.sh dispatcher.sh script-manager.sh folder-manager.sh; do sh -n "$script"; done
          bash tests/test-dispatcher.sh
          bash tests/test-personal-scripts.sh
          bash tests/test-folders.sh
          test -z "$(find . -name '*.so' -o -name '*.dex')"
      - name: Package optional KernelSU module
        shell: bash
        run: |
          set -euo pipefail
          cd modules/dormos-nfc-ksu
          chmod 0755 run.sh dispatcher.sh script-manager.sh folder-manager.sh action.sh
          zip -q -r "$GITHUB_WORKSPACE/dormos-nfc-ksu.zip" module.prop skip_mount run.sh dispatcher.sh script-manager.sh folder-manager.sh action.sh README.md
          unzip -l "$GITHUB_WORKSPACE/dormos-nfc-ksu.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-nfc-ksu-module
          path: dormos-nfc-ksu.zip

  # One-off, explicitly requested public download channel. Only commits with
  # release-preview: prefix trigger publication, and only after BOTH jobs pass.
  # No main merge and no stable/release signing is implied.
  publish-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/ncwu-nfc-one-shot-v1' && startsWith(github.event.head_commit.message, 'release-preview:') }}
    needs: [debug-apk, ksu-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: dorm-os-nfc-receiver-debug
          path: preview/apk
      - name: Download verified KernelSU module
        uses: actions/download-artifact@v4
        with:
          name: dorm-os-nfc-ksu-module
          path: preview/ksu
      - name: Publish APK and KernelSU ZIP as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s preview/apk/app-debug.apk
          test -s preview/ksu/dormos-nfc-ksu.zip
          mkdir -p public
          cp preview/apk/app-debug.apk public/TapFlow-V1.16.1-preview-debug.apk
          cp preview/ksu/dormos-nfc-ksu.zip public/TapFlow-KernelSU-V1.10-preview.zip
          sha256sum public/*
          TAG="tapflow-v1.16.1-preview"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Refusing to overwrite the previously published preview: $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            public/TapFlow-V1.16.1-preview-debug.apk \
            public/TapFlow-KernelSU-V1.10-preview.zip \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
            --title "触序 · TapFlow V1.16.1 · 原位 NDEF 写卡与生命周期保护" \
            --notes "对应通过 Android 单元测试、Debug APK 构建、KernelSU 模块测试的同一提交 $GITHUB_SHA。触序 TapFlow V1.16.1 将普通 NDEF 文本/网址写入并入工具页底部弹层，删除独立写卡 Activity；管理区图标统一为细线矢量，整行使用单一点击 Surface。修复 NFC 回调领取标签与 Activity 切后台之间的竞态；保留普通 NDEF 覆盖授权、DORM 自动化标签保护和字节级回读。未完成实体 NFC 和 Android 16 锁屏实测。Debug 签名不是稳定签名。"
