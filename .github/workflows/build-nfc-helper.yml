name: Build DORM OS NFC helper debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/nfc-helper/**'
      - '.github/workflows/build-nfc-helper.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android/nfc-helper
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dorm-os-ncwu-nfc-debug
          path: android/nfc-helper/app/build/outputs/apk/debug/app-debug.apk
