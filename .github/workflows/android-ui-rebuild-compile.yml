name: Android UI rebuild compile gate
on:
  push:
    branches: [refactor/android-ui-clean-rebuild]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: android-ui-rebuild-${{ github.ref }}
  # Preserve the running branch QA package while newer commits queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compile-and-test:
    if: github.event_name == 'push' || github.head_ref == 'refactor/android-ui-clean-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install existing compile SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile existing app and run all JVM tests
        run: gradle -p apps/xiaoxu-android :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile instrumentation sources without running an emulator
        run: gradle -p apps/xiaoxu-android :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace
      - name: Build isolated UI rebuild QA APK
        run: gradle -p apps/xiaoxu-android :app:assembleDebug -PxiaoxuIsolatedQa=true --no-daemon --stacktrace
      - name: Verify isolated package and stage APK
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/xiaoxu-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='io.github.x07xh.xiaoxu.unifiedqa'"
          mkdir -p qa-artifacts
          cp "$apk" "qa-artifacts/xiaoxu-ui-rebuild-${GITHUB_SHA:0:12}.apk"
          (cd qa-artifacts && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload installable UI rebuild QA APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-ui-rebuild-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Build isolated optimized performance QA APK
        run: gradle -p apps/xiaoxu-android :app:assembleRelease -PxiaoxuPerformanceQa=true --no-daemon --stacktrace
      - name: Sign and verify isolated performance package
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned=apps/xiaoxu-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          mkdir -p performance-artifacts
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export QA_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$tmp/qa.p12" -storetype PKCS12 -storepass:env QA_PASS -keypass:env QA_PASS -alias qa -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Xiaoxu isolated performance QA' >/dev/null 2>&1
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$tmp/aligned.apk"
          apk="performance-artifacts/xiaoxu-performance-${GITHUB_SHA:0:12}.apk"
          "$tools/apksigner" sign --ks "$tmp/qa.p12" --ks-key-alias qa --ks-pass env:QA_PASS --key-pass env:QA_PASS --out "$apk" "$tmp/aligned.apk"
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" > "$tmp/badging"
          grep -F "package: name='io.github.x07xh.xiaoxu.performanceqa'" "$tmp/badging"
          if grep -q 'application-debuggable' "$tmp/badging"; then exit 1; fi
          (cd performance-artifacts && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload installable optimized performance QA APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxu-performance-qa-${{ github.sha }}
          path: performance-artifacts/
          if-no-files-found: error
          retention-days: 14
