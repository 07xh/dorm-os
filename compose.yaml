services:
  xiaoxu:
    build: .
    init: true
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - xiaoxu-local-data:/data
      - type: bind
        source: ./.env.docker
        target: /app/.dev.vars
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:8788/'),fetch('http://127.0.0.1:8788/api/v1/health')]).then(([a,b])=>{if(!a.ok||b.status!==401)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
volumes:
  xiaoxu-local-data:
