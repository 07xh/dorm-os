plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    // 提供 baselineProfile { } DSL 与 :app:generateBaselineProfile 任务。
    // 只做 profile 生成，不引入运行时依赖。
    id 'androidx.baselineprofile'
}

android {
    namespace 'io.github.x07xh.xiaoxu'
    compileSdk 36

    defaultConfig {
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        applicationId 'io.github.x07xh.xiaoxu'
        minSdk 26
        targetSdk 35
        versionCode 36
        versionName '0.8.15'
        // Normal application identity remains unchanged. Only explicit QA builds
        // use their own app data and authorization-return host.
        manifestPlaceholders = [
            qaAppLabel: '@string/app_name',
            schoolAuthHost: 'school-auth-return'
        ]
        // This same host is validated by SchoolAuthReturn.consume().
        resValue 'string', 'school_auth_return_host', 'school-auth-return'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    // Offline runtime fixtures have independent storage and no INTERNET permission.
    if (project.hasProperty('xiaoxuRuntimeTest')) {
        sourceSets.debug.manifest.srcFile 'src/runtimeVerification/AndroidManifest.xml'
    }
    buildTypes {
        debug {
            if (project.hasProperty('xiaoxuRuntimeTest')) {
                applicationIdSuffix '.secondclassruntime'
                manifestPlaceholders.qaAppLabel = '校序 · 离线测试'
            } else if (project.findProperty('xiaoxuIsolatedQa')?.toString() == 'true') {
                applicationIdSuffix '.unifiedqa'
                manifestPlaceholders.qaAppLabel = '校序 · 整合验证'
                // Distinct from both the official app and previous second-class QA install.
                manifestPlaceholders.schoolAuthHost = 'school-auth-return-unified-qa'
                resValue 'string', 'school_auth_return_host', 'school-auth-return-unified-qa'
            }
        }
        // Signing is performed by the release job after all checks pass.
        // No public debug-key fallback is permitted for formal releases.
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Baseline Profile：profile 由 :benchmark 的 startupAndMainTabs 生成。
    // automaticGenerationDuringBuild = false —— 不在每次 assembleRelease 时重跑（很慢），
    // 只在显式执行 :app:generateBaselineProfile 时生成。
    baselineProfile {
        automaticGenerationDuringBuild = false
        // Dex 布局优化：把启动热路径的类排到 dex 前面，减少冷启动时的 IO 随机访问。
        dexLayoutOptimization = true
    }
}

dependencies {
    // Official, maintained open-source AndroidX libraries. No school-session scraping.
    // Compose 1.12 from the Aug 2026 BOM requires API 37 / AGP 9.1+.
    // Stay on a compatible stable BOM until the entire build toolchain is upgraded.
    implementation platform('androidx.compose:compose-bom:2026.03.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // 北化课表玻璃材质：仅在 Android 13+ 启用，旧设备保留原 Compose 导航。
    implementation 'io.github.kyant0:shapes:1.2.0'
    implementation 'io.github.kyant0:backdrop:2.0.0-alpha03'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    implementation 'androidx.work:work-runtime-ktx:2.11.0'
    ksp 'androidx.room:room-compiler:2.8.5'
    // 已随 activity-compose 传递引入，这里显式声明版本：release 包靠它在首次启动后
    // 安装 baseline profile。没有它，生成的 profile 只对安装它的那台设备生效。
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    baselineProfile(project(':benchmark'))
    // Mature MIT HTML parser, same parsing layer used by the reference client.
    implementation 'org.jsoup:jsoup:1.21.2'
    testImplementation 'junit:junit:4.13.2'
    // JVM tests exercise JSONObject with a real implementation, not Android stubs.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
