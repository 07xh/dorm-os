plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'io.github.x07xh.xiaoxu'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.x07xh.xiaoxu'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '0.7.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    // Official, maintained open-source AndroidX libraries. No school-session scraping.
    // Compose 1.12 from the Aug 2026 BOM requires API 37 / AGP 9.1+.
    // Stay on a compatible stable BOM until the entire build toolchain is upgraded.
    implementation platform('androidx.compose:compose-bom:2026.03.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // Preserve the reviewed TWA launcher only as an explicitly named legacy fallback.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
