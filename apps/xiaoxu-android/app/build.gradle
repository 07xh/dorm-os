plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.x07xh.xiaoxu'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.x07xh.xiaoxu'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Official Google-maintained TWA launcher. No custom WebView or credential bridge.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
