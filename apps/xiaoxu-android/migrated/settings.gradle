pluginManagement {
    repositories {
        google()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    plugins {
        id 'org.jetbrains.kotlin.android' version '2.4.20'
        id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20'
        id 'com.google.devtools.ksp' version '2.3.12'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        // Resolve Maven Central artifacts before mirrors: a transient mirror 502
        // must not block release lint or the release candidate build.
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        // GeckoView is published on Mozilla's Maven repository.
        maven { url 'https://maven.mozilla.org/maven2'; content { includeGroup 'org.mozilla.geckoview' } }
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
}

include ':app'
rootProject.name = "CourseSelector"

