# Explicitly selected only by Docker/local commands. Never used for Pages deploy.
name = "xiaoxu-local"
compatibility_date = "2026-11-09"
pages_build_output_dir = "./public"
[vars]
ACADEMIC_AUTH_MODE = "owner_password"
[[d1_databases]]
binding = "ACADEMIC_DB"
database_name = "xiaoxu-local"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"
