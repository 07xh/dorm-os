const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setTab(t){state.tab=t;state.modal='';render(); $('#screen').scrollTop=0}
function header(){let t={home:['早上好','DORM OS · NFC 助手'],scenes:['我的场景','按触发方式组织，而不是按页面组织'],tools:['实用工具','脚本、记录与配置集中管理']}[state.tab]; $('#pageTitle').textContent=t[0];$('#pageHint').textContent=t[1];$('#headerBtn').innerHTML=icon(state.tab==='home'?'gear':state.tab==='scenes'?'plus':'list'); $('#headerBtn').setAttribute('aria-label',state.tab==='scenes'?'新增场景':'设置或日志')}
function render(){header();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('#screen').innerHTML=state.tab==='home'?home():state.tab==='scenes'?scenes():tools(); renderModal()}
function home(){return `<div class="hero"><div class="kicker">${icon('nfc','mini')} NFC 场景控制</div><h3>轻触标签，<br>立即执行。</h3><p>为常用操作创建快捷入口，减少手动步骤。</p><div class="scan-symbol">${icon('nfc')}</div><button class="primary" data-act="scan">${icon('nfc','mini')} 模拟扫描标签</button></div><div class="sectiontop"><h3>设备状态</h3><span class="counter">演示数据 · 不读取真实设备</span></div><div class="status-list"><div class="statusitem"><div class="iconbox">${icon('nfc')}</div><div class="grow"><div class="name">NFC</div><div class="hint">等待真实设备接口接入</div></div><span class="pill off">未检测</span></div><div class="statusitem"><div class="iconbox">${icon('shield')}</div><div class="grow"><div class="name">KernelSU</div><div class="hint">运行权限在正式 APK 中验证</div></div><span class="pill off">未检测</span></div></div><div class="sectiontop"><h3>常用场景</h3><button class="quiet-btn" data-act="scenes">查看全部 ${icon('arrow','mini')}</button></div><div class="status-list">${state.scenes.filter(s=>s.active).slice(0,2).map(s=>`<button class="light-action" data-scene="${s.id}"><span class="actionicon">${icon(s.kind==='nfc'?'nfc':'bolt')}</span><span class="grow"><b>${esc(s.name)}</b><p>${esc(s.action)}</p></span>${icon('arrow','mini chevron')}</button>`).join('')||'<p class="muted small">还没有启用的场景</p>'}</div><div class="inline-status"><span class="dot"></span> 当前为交互演示。实际硬件操作尚未连接。</div>`}
function scenes(){let items=state.scenes.filter(s=>state.filter==='全部'||(state.filter==='NFC'&&s.kind==='nfc')||(state.filter==='按键'&&s.kind==='key'));return `<div class="topStat">已创建 <b>${state.scenes.length}</b> 个场景 · 启用 ${state.scenes.filter(s=>s.active).length} 个</div><div class="filterbar">${['全部','NFC','按键'].map(f=>`<button class="filter ${f===state.filter?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="scene-list">${items.map(s=>`<button class="scene-row" data-scene="${s.id}"><span class="scene-icon ${s.kind==='key'?'alt':''}">${icon(s.kind==='nfc'?'nfc':'bolt')}</span><span class="grow"><span class="label">${esc(s.name)}</span><div class="detail">${esc(s.trigger)} · ${esc(s.action)}</div></span><span class="pill ${s.active?'':'off'}">${s.active?'启用':'停用'}</span></button>`).join('')}</div><button class="add-scene" data-act="add">${icon('plus','mini')} 新建场景</button><p class="callout">NFC 负责触发；侧键和三段式负责快捷操作；脚本只是可选的执行动作。它们共享一套场景管理，不再各占多个页面。</p>`}
function tools(){return `<div class="sectiontop" style="margin-top:3px"><h3>脚本文件</h3><button class="quiet-btn" data-act="newScript">${icon('plus','mini')} 新建</button></div><div class="toolgroup">${state.scripts.map((s,i)=>`<div class="toolrow"><span class="ico">${icon('script')}</span><span class="grow"><b>${esc(s.name)}</b><p>/${esc(s.folder)}/${esc(s.name)}</p></span><button class="run" data-run="${i}" aria-label="预览运行 ${esc(s.name)}">${icon('bolt','mini')}</button></div>`).join('')}</div><div class="sectiontop"><h3>管理</h3></div><div class="toolgroup"><button class="toolrow" data-act="logs"><span class="ico">${icon('clock')}</span><span class="grow"><b>运行记录</b><p>触发与执行结果集中查看</p></span>${icon('arrow','mini chevron')}</button><button class="toolrow" data-act="backup"><span class="ico">${icon('shield')}</span><span class="grow"><b>配置与备份</b><p>导入、导出、权限信息</p></span>${icon('arrow','mini chevron')}</button><button class="toolrow" data-act="theme"><span class="ico">${icon('gear')}</span><span class="grow"><b>外观与交互</b><p>主题、反馈方式、无障碍选项</p></span>${icon('arrow','mini chevron')}</button></div><p class="callout">脚本执行采用显式确认和权限验证。这个原型只模拟反馈，不调用 Shell、Root 或校园网认证。</p>`}
function sheet(title,content){return `<div class="modal-wrap" id="shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><div class="sheettop"><h3>${esc(title)}</h3><button class="x" data-act="close" aria-label="关闭">${icon('close','mini')}</button></div>${content}</section></div>`}
function renderModal(){let old=$('#shade');if(old)old.remove();let markup='';if(state.modal==='scan'){let s=state.scanStep;markup=sheet('NFC 标签',`<div class="scanrings">${icon(s===2?'check':'nfc')}</div><div class="center"><div class="scan-title">${['靠近手机 NFC 区域','正在识别标签','标签已识别'][s]}</div><div class="scan-hint">${['此页面模拟 NFC 状态变化，不读取真实标签。','识别中 · 演示状态','已匹配「回到宿舍」场景 · 演示结果'][s]}</div></div>${s===2?`<div class="result"><span class="ok">${icon('check')}</span><span><b>匹配到已绑定的场景</b><p>联网.sh · 执行前需要权限检查</p></span></div>`:''}<button class="primary sheet-action" data-act="nextscan">${s===2?'查看关联场景':s===1?'显示识别结果':'模拟识别'}</button>${s===2?'<button class="secondary sheet-action" data-act="close">完成</button>':''}`)}
if(state.modal==='detail'){let s=state.scenes.find(s=>s.id===Number(state.currentScene));if(s) markup=sheet(s.name,`<div class="option-card selected"><span class="choiceicon">${icon(s.kind==='nfc'?'nfc':'bolt')}</span><span class="grow"><div class="opt-title">触发方式</div><div class="opt-hint">${esc(s.trigger)}</div></span></div><div class="option-card"><span class="choiceicon">${icon('script')}</span><span class="grow"><div class="opt-title">执行动作</div><div class="opt-hint">${esc(s.action)}</div></span></div><div class="option-card"><span class="grow"><div class="opt-title">启用这个场景</div><div class="opt-hint">关闭后保留配置，不再响应触发事件</div></span><button class="switch ${s.active?'on':''}" data-toggle="${s.id}" aria-label="切换启用状态"></button></div><div class="bottombar"><button class="secondary" data-act="edit">${icon('edit','mini')} 编辑</button><button class="primary" data-act="testScene">模拟触发</button></div>`)}
if(state.modal==='editor'){let edit=state.currentScene&&state.scenes.find(s=>s.id===Number(state.currentScene));markup=sheet(edit?'编辑场景':'新建场景',`<div class="field"><label for="sceneName">场景名称</label><input id="sceneName" maxlength="30" placeholder="例如：学习模式" value="${esc(state.form.name)}"/></div><div class="field"><label for="sceneTrigger">触发方式</label><select id="sceneTrigger"><option value="nfc" ${state.form.kind==='nfc'?'selected':''}>NFC 标签</option><option value="key" ${state.form.kind==='key'?'selected':''}>侧键 / 三段式（待接入）</option></select></div><div class="field"><label for="sceneAction">执行动作</label><select id="sceneAction"><option ${state.form.action==='执行脚本'?'selected':''}>执行脚本</option><option ${state.form.action==='打开应用'?'selected':''}>打开应用</option><option ${state.form.action==='切换系统设置'?'selected':''}>切换系统设置</option></select></div><div class="field"><label for="sceneTarget">动作内容（演示值）</label><input id="sceneTarget" maxlength="120" placeholder="脚本路径或应用名称" value="${esc(state.form.target)}"/></div><div class="warning">正式 APK 中，NFC 绑定会等待真实标签识别；脚本执行需要 Root 授权与权限确认。这里仅保存原型中的配置。</div><button class="primary sheet-action" data-act="save">保存场景</button>`)}
if(state.modal==='run'){markup=sheet('运行预览',`<div class="warning">这是交互演示。点击确认只添加一条“模拟执行”记录，不会执行任何 Shell 命令。</div><div class="result">${icon('script')}<span><b>${esc(state.currentScene)}</b><p>尚未连接 KernelSU 执行器</p></span></div><button class="primary sheet-action" data-act="confirmRun">确认模拟运行</button>`)}
if(state.modal==='done'){markup=sheet('模拟执行完成',`<div class="scanrings">${icon('check')}</div><div class="center scan-title">演示操作完成</div><p class="center muted small">真实脚本并未执行，当前只展示反馈、日志和完成状态。</p><button class="primary sheet-action" data-act="logs">查看运行记录</button><button class="secondary sheet-action" data-act="close">关闭</button>`)}
if(state.modal==='logs'){markup=sheet('运行记录',`<div class="toolgroup">${state.logs.map(l=>`<div class="history">${icon(l.ok?'check':'clock')}<span><b>${esc(l.text)}</b><p>${esc(l.time)} · 交互原型</p></span></div>`).join('')}</div><button class="secondary sheet-action" data-act="close">返回</button>`)}
if(state.modal==='theme'){markup=sheet('外观与交互',`<p class="muted small" style="margin-top:0;line-height:1.6">比较三种独立视觉方向。手机上可直接切换，选择不会改变真实系统设置。</p>${[['default','一加简约','简洁蓝白，突出主操作'],['night','深色控制台','弱光环境，状态更聚焦'],['editorial','暖白极简','克制留白、深绿强调']].map(([id,name,desc])=>`<button class="option-card ${state.theme===id?'selected':''}" style="width:100%;text-align:left;cursor:pointer" data-theme="${id}"><span class="choiceicon">${icon('gear')}</span><span class="grow"><div class="opt-title">${name}</div><div class="opt-hint">${desc}</div></span>${state.theme===id?icon('check','mini'):''}</button>`).join('')}<button class="secondary sheet-action" data-act="close">完成</button>`)}
if(state.modal==='backup'){markup=sheet('配置与备份',`<div class="callout">本原型不访问文件系统、账号或凭据；正式实现将沿用经过验证的备份校验、路径限制与配置管理逻辑。</div><button class="option-card" style="width:100%;margin-top:12px;text-align:left" data-act="backdemo">${icon('shield')} <span>演示备份流程</span></button>`)}
if(state.modal==='newScript'){markup=sheet('新建脚本（原型）',`<div class="field"><label for="newScriptName">脚本名称</label><input id="newScriptName" value="我的脚本.sh"/></div><div class="warning">这里只建立一个模拟脚本条目，不创建真实文件。</div><button class="primary sheet-action" data-act="saveScript">添加到演示列表</button>`)}
if(markup)$('#device').insertAdjacentHTML('beforeend',markup)}
function toast(text){let old=$('#toaster');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.id='toaster';el.textContent=text;$('#device').appendChild(el);setTimeout(()=>el.remove(),2600)}
function chooseTheme(t){state.theme=t;const dev=$('#device');dev.classList.remove('night','editorial');if(t!=='default')dev.classList.add(t);document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('selected',b.dataset.theme===t));render()}
function openDetail(id){state.currentScene=id;state.modal='detail';renderModal()}
function startEditor(edit=false){if(edit){let s=state.scenes.find(s=>s.id===Number(state.currentScene));state.form={name:s.name,kind:s.kind,action:s.action.startsWith('执行')?'执行脚本':'打开应用',target:s.action.replace(/^执行\s*/,'')}}else{state.currentScene='';state.form={name:'',kind:'nfc',action:'执行脚本',target:'/校园/联网.sh'}}state.modal='editor';renderModal()}
function handleAct(act){switch(act){case 'scan':state.modal='scan';state.scanStep=0;renderModal();break;case 'nextscan':if(state.scanStep<2){state.scanStep++;renderModal()}else{state.tab='scenes';render();openDetail(1)}break;case 'close':state.modal='';renderModal();break;case 'scenes':setTab('scenes');break;case 'add':startEditor(false);break;case 'edit':startEditor(true);break;case 'save':{const name=$('#sceneName').value.trim(),kind=$('#sceneTrigger').value,action=$('#sceneAction').value,target=$('#sceneTarget').value.trim();if(!name){toast('请填写场景名称');break}if(!target){toast('请填写动作内容');break}const s={id:state.currentScene?Number(state.currentScene):Date.now(),name,kind,trigger:kind==='nfc'?'NFC 标签':'侧键 / 三段式（待接入）',action:action==='执行脚本'?`执行 ${target}`:`${action} · ${target}`,active:true};if(state.currentScene){const idx=state.scenes.findIndex(x=>x.id===s.id);state.scenes[idx]=s}else state.scenes.unshift(s);state.modal='';state.tab='scenes';render();toast('场景已保存至原型');break}
case 'testScene':{let s=state.scenes.find(s=>s.id===Number(state.currentScene));state.currentScene=s.action;state.modal='run';renderModal();break}case 'confirmRun':state.logs.unshift({text:state.currentScene+' · 演示执行',time:'刚刚',ok:true});state.modal='done';renderModal();break;case 'logs':state.modal='logs';renderModal();break;case 'theme':state.modal='theme';renderModal();break;case 'backup':state.modal='backup';renderModal();break;case 'backdemo':toast('备份逻辑需要在正式 APK 中接入');break;case 'newScript':state.modal='newScript';renderModal();break;case 'saveScript':{let name=$('#newScriptName').value.trim().replace(/[\\/]/g,'');if(!name){toast('请输入有效名称');return}if(!name.endsWith('.sh'))name+='.sh';state.scripts.unshift({name,folder:'自定义',last:'刚刚'});state.modal='';render();toast('已添加模拟脚本');break}default:break}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.theme){chooseTheme(b.dataset.theme);return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}if(b.dataset.scene){openDetail(b.dataset.scene);return}if(b.dataset.toggle){let s=state.scenes.find(s=>s.id===Number(b.dataset.toggle));s.active=!s.active;renderModal();toast(s.active?'场景已启用':'场景已停用');return}if(b.dataset.run!==undefined){state.currentScene=state.scripts[Number(b.dataset.run)].name;state.modal='run';renderModal();return}if(b.id==='headerBtn'){handleAct(state.tab==='scenes'?'add':state.tab==='tools'?'logs':'theme');return}if(b.dataset.act){handleAct(b.dataset.act);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal='';renderModal()}});
render();
</script>
</body></html>
